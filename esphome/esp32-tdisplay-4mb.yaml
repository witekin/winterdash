# =============================================================================
# WinterDash — LilyGO TTGO T-Display, 4MB flash variant (ESP32, mipi_spi T-DISPLAY, 240x135)
# -----------------------------------------------------------------------------
# SAME panel + UI as esp32-tdisplay-16mb.yaml — the ONLY differences are the 4MB flash budget:
#   - board_esp32_tdisplay_4mb (flash_size 4MB + partitions_esp32_tdisplay_4mb)
#   - a MINIMAL baked set (Battery only, LCD + web) — declared in tools/board_assets.yaml (screen:[Battery],
#     web:[Battery]) and emitted by gen_board_assets.py: banner_preset_esp32-tdisplay-4mb.yaml (picker Battery
#     + Custom), banners_baked_esp32-tdisplay-4mb.h (web hero), and NO presets package (no non-Battery bakes).
# Everything else (core, display_tdisplay UI, 2-button input, producers) is shared, unchanged.
# Result: app ~1.81MB fits a 0x1D0000 dual-OTA slot -> cable-less OTA preserved; 320KB storage = 1 full-quality
# custom banner slot.
# =============================================================================

substitutions:
  device_name: "winterdash"
  friendly_name: "WinterDash"
  fw_version: "dev-esp32-tdisplay-4mb"   # board-id half MUST match the GitHub release asset name (esp32-tdisplay-4mb-<ver>.ota.bin) so the web-OTA update-check finds this board's asset. Release form: "<ver>-esp32-tdisplay-4mb". Shown on the System screen + web About / HA
  ble_signal_stale_s: "10"    # STEP 1: BLE signal "gone" (top-bar dot -> grey, BLE quality -> "No signal")
  ble_timeout_s: "20"         # STEP 2: full OFFLINE overlay + LED at 20s (was 30) — "message not disco": brief
                              # alert then relax fast (display_tdisplay offline relax 25/100). A "No signal" event logged
  compute_interval: 1s
  draw_interval: 500ms

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: "2026.4.0"
  name_add_mac_suffix: true   # -> winterdash-<mac6>.local (distinct per unit; AP SSID stays static WinterDashAP)
  # 4MB partition table (0x1D0000 dual-OTA + 320KB storage) is set under esp32: in board_esp32_tdisplay_4mb.
  # Reflash-gated: the table only changes via a CABLE flash (OTA can't rewrite it).
  includes:
    - dashboard_html.h
    - convert_html.h
    - banners_baked_esp32-tdisplay-4mb.h   # 4MB: Battery-only web hero (generated from board_assets.yaml)
    - web_dashboard.h
    - ble_scan.h
    - charge_log.h
    - wifi_reset.h
    - netwatch_rtc.h
    - api_traffic.h      # watchdog API-liveness feed (clean decl; shim in api_traffic.cpp)
    - api_traffic.cpp    # separate TU (NOT #included into main) -> its access shim stays contained
    - netwatch_probe.h   # watchdog Phase 2 — client-independent tcpip-thread liveness probe
    - netwatch_probe.cpp
    - status_compute.h
    - wd_font_buf.h      # A5: static A8 glyph draw buffer -> glyph rasterization off the fragmentable 8-bit heap (NULL-deref crater mitigation); installed in the on_boot(-100) splash before lv_refr_now
    - backlight_model.h  # C1: pure header — the single backlight ladder (wd_bl::eff_backlight), shared with the CYD (no LDR -> darkness fixed 0)
# --- Package composition (4MB T-Display) -------------------------------------
packages:
  core: !include packages/core.yaml             # board-agnostic platform layer
  banner_preset: !include packages/banner_preset_esp32-tdisplay-4mb.yaml  # generated picker: Battery + Custom
  board: !include packages/board_esp32_tdisplay_4mb.yaml       # T-Display hardware, 4MB flash
  display: !include packages/display_tdisplay.yaml # shared T-Display UI (bakes only Battery here — no presets_extra)
  input: !include packages/input_tdisplay_2btn.yaml     # T-Display 2-button nav
  mock: !include packages/mock_data.yaml        # Demo producer + canonical interface
  victron: !include packages/victron_ble.yaml   # Live producer (real BLE decode)
