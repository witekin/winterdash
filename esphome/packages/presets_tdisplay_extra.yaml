# =============================================================================
# presets_tdisplay_extra.yaml — the 9 NON-Battery on-screen baked banner presets (dash + saver, 18 LVGL
# images). Merged into display_tdisplay's `image:` node. Included ONLY by boards that bake the full
# gallery (16MB T-Display). A minimal-baked board (4MB T-Display) omits this package + defines
# WD_BAKE_MINIMAL, so display_tdisplay keeps only Battery and its preset lookup-chains collapse to it.
# =============================================================================
