        # ----- Unified full-screen takeover overlay (offline / fault / netfault -> ONE state-driven overlay).
        # Tier-3 heap merge (A3 backport from CYD display_cyd.yaml:626-697): the 3 former overlays (offline_overlay/
        # fault_overlay/netfault_overlay) were byte-identical 240x135 s_bg_screen COLUMN/CENTER containers; only per-
        # label content/colour + fault's 2nd (ctx) line differed. One container + 6 labels (was 17 objects) driven by
        # state in the draw takeover -> ~1.5-2KB resident 8-bit heap reclaimed. The takeover keeps the 3 priority
        # branches (netfault > offline > fault) + still publishes fault_active/offline_alert unchanged (the RGB LED /
        # saver / backlight read those GLOBALS, never these ids). ov_sub = fault ctx (hidden else); ov_clock/ov_demo
        # hidden in netfault; the icon/title opacity is FAULT-flash-only (reset on every entry). -----
        - obj:
            id: ov
            x: 0
            y: 0
            width: 240
            height: 135
            scrollbar_mode: "OFF"
            styles: [s_bg_screen]
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 6
            widgets:
              - label:
                  id: ov_icon
                  text: ""
                  width: 240
                  text_font: mdi_32
                  text_color: 0xef4444
                  text_align: CENTER
              - label:
                  id: ov_title
                  text: ""
                  width: 240
                  text_font: montserrat_20
                  text_color: 0xef4444
                  text_align: CENTER
              - label:
                  id: ov_msg
                  text: ""
                  width: 220
                  text_font: montserrat_14
                  text_color: 0xe8e8e8
                  text_align: CENTER
                  long_mode: WRAP
              - label:
                  id: ov_sub
                  text: ""
                  width: 220
                  text_font: montserrat_10
                  text_color: 0x777777
                  text_align: CENTER
                  hidden: true
              # Lone clock top-right (the overlay covers the top-bar clock) — set per-branch via set_ov_clock in the
              # draw takeover. ignore_layout so it sits absolute, not in the centred flex column.
              - label:
                  id: ov_clock
                  ignore_layout: true
                  align: TOP_RIGHT
                  x: -8
                  y: 6
                  text: "--:--"
                  text_font: montserrat_12
                  text_color: 0x999999
              - label:   # DEMO cue (toggled per-branch in the takeover); amber so it reads on the red overlay
                  id: ov_demo
                  ignore_layout: true
                  align: TOP_LEFT
                  x: 8
                  y: 6
                  text: "DEMO"
                  text_font: montserrat_10
                  text_color: 0xf5b942
                  hidden: true

