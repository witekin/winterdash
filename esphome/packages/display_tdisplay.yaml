        # ----- Network-fault degrade overlay (HIGHEST-priority takeover; netwatch breaker tripped) -----
        # Shown when id(netwatch_disabled) is set (the network watchdog's reset-breaker, core.yaml). Terminal until a
        # power-cycle. AMBER (not the red of charger offline/fault) = "device needs your action", a different
        # class than a charger danger. Text is the ONLY recovery instruction: OTA is unreachable during an
        # active wedge, so it must give the universal recovery action — a physical power-cycle (unplug/replug).
