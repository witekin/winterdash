# --- UI/nav/backlight/splash globals (display-only; S4b). Omitted on a headless board along with the
# rest of display_tdisplay. fault_active + serious_warn_active are draw-written/500ms-display-read. ---
globals:
  - id: current_page
    type: uint8_t
    restore_value: no
    initial_value: "0"
  # want-loader "already shown" guard (A1 state-driven loader). A GLOBAL (not a lambda-static) so the button
  # handlers (input_tdisplay_2btn) can load instantly through the SAME guarded loader that the 500ms housekeeping
  # runs — no double-load. int (not uint8_t): holds -3 saver / -2 setup / 0-5 pages. -1 = nothing loaded yet.
  - id: disp_shown
    type: int
    restore_value: no
    initial_value: "-1"
  # System actions menu (on the System screen). in_menu = actions list shown;
  # menu_sel = 0 Reboot(hold 2s) / 1 Reset WiFi(hold 3s) / 2 Factory reset(hold 5s) / 3 Back(header);
  # s2_hold_ms = hold-start millis for whichever hold row is armed (all three rows are hold-to-confirm).
  - id: in_menu
    type: bool
    restore_value: no
    initial_value: "false"
  - id: menu_sel
    type: int
    restore_value: no
    initial_value: "0"
  - id: s2_hold_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: backlight_dim
    type: bool
    restore_value: no
    initial_value: "false"
  - id: idle_dim_level         # screen idle-dim: 0=OFF(panel dark) 1=LOW 2=MED 3=HIGH — web /wd/cfg 'idim', NVS. Default MED. (unified with the CYD; TTGO has no LDR so darkness is always 0)
    type: int
    restore_value: true
    initial_value: '2'
  - id: fault_active
    type: bool
    restore_value: no
    initial_value: "false"
  # Serious anomaly (over/undervoltage — the red "check charger/battery" verdicts, NOT the soft
  # band). Set by the 500ms content lambda, read by the 500ms housekeeping to KEEP THE BACKLIGHT
  # LIT (and wake a dimmed screen) so it draws attention in the garage. Auto-return unchanged.
  - id: serious_warn_active
    type: bool
    restore_value: no
    initial_value: "false"
  # Screensaver (idle view): active once inactivity passes return_timeout (unless fault/warning/
  # offline). Waking is two-step: a press on a DIMMED saver only brightens (stays on the saver);
  # the next press leaves for the dashboard. No auto-jump/linger.
  - id: saver_active
    type: bool
    restore_value: no
    initial_value: "false"
  # Offline ALERT phase (display-only): true while the full-screen "CHARGER OFFLINE" overlay should show — i.e.
  # offline AND (never-online OR within the first relax window of a had-signal drop — 25s DROP / 100s never-online,
  # folded inline in the draw takeover, no longer a substitution). After the window it
  # goes false -> the saver-suppress gates below release -> the ambient idle flow (banner + a quiet "Offline")
  # runs. Display-written + display-read only (headless has no draw lambda) -> stays out of core.yaml (R3).
  - id: offline_alert
    type: bool
    restore_value: no
    initial_value: "false"
  # Boot splash (brand entrance ~2.6s). splash_active gates it on: while true the 500ms loop drives the
  # lv_anim entrance and SUPPRESSES all other page management (AP takeover / saver / auto-return) and nav.
  # splash_start_ms = the elapsed reference for the entrance timings. (splash_started removed 2026-09-09 — it was a
  # dead write-only global; the anims are set up once in on_boot(-100), which runs once by construction.)
  - id: splash_active
    type: bool
    restore_value: no
    initial_value: "true"
  - id: splash_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# --- UI DRAW loop (display-only; S4b). Pure reader of status_compute::status_out() + globals; all lv_*.
# Runs at ${draw_interval} (500ms). Omitted on a headless board.
interval:
  # Brightness config bridge (the web-config write path): apply web /wd/cfg POSTs on the MAIN loop (never from the httpd task — a number
  # make_call can touch LVGL/backlight; same rule as bindkey) + publish the /wd/cfg.json seed. TTGO owns bl/dimto/retto/
  # IDIM (screen idle-dim level 0..3; UNIFIED with the CYD). It has NO LDR -> no `auto`, and NO LED -> no `led` (the
  # shared handler just parks a field a board doesn't read). idle_dim_level is a plain global (not a number) -> drain direct.
  - interval: 1s
    then:
      - lambda: |-
          namespace wdd = esphome::web_dashboard;
          if (wdd::cfg_pending.load(std::memory_order_acquire)) {
            wdd::cfg_pending.store(false, std::memory_order_relaxed);
            int v;
            if ((v = wdd::cfg_bl.exchange(-1))    >= 0) id(backlight_level).make_call().set_value(v).perform();
            if ((v = wdd::cfg_dimto.exchange(-1)) >= 0) id(dim_timeout).make_call().set_value(v).perform();
            if ((v = wdd::cfg_retto.exchange(-1)) >= 0) id(return_timeout).make_call().set_value(v).perform();
            if ((v = wdd::cfg_idim.exchange(-1))  >= 0) id(idle_dim_level) = v;   // screen idle-dim level 0..3 (NVS global; the dim machine reads it)
          }
          static char last[72] = {0};
          char cb[72];
          snprintf(cb, sizeof(cb), "{\"bl\":%d,\"dimto\":%d,\"retto\":%d,\"idim\":%d}",
                   (int) id(backlight_level).state, (int) id(dim_timeout).state,
                   (int) id(return_timeout).state, id(idle_dim_level));
          if (strcmp(cb, last) != 0) { strcpy(last, cb); wdd::slot_cfg.publish(std::string(cb)); }
  - interval: ${draw_interval}
    then:
      - lambda: |-
          auto &o = esphome::status_compute::status_out();
          uint32_t now = millis();
          uint32_t age = now - id(last_packet_ms);
          // serious_warn_active is compute-derived (o.serious_warn) but display-owned; written here, ungated,
          // BEFORE the offline early-return so entering offline (o.serious_warn=false) clears the keep-lit flag.
          id(serious_warn_active) = o.serious_warn;

          // Persistent DEMO badges (dashboard + saver). The merged overlay's own DEMO cue (ov_demo) is toggled
          // per-branch inside the draw takeover (offline/fault), matching the CYD `ov` model — so an unpaired unit
          // in a red OFFLINE/FAULT phase (live_content hidden) still shows a "this is a demo" cue.
          for (auto *d : {id(demo_badge), id(saver_demo_badge)}) {
            if (id(demo_active)) lv_obj_clear_flag(d, LV_OBJ_FLAG_HIDDEN);
            else      lv_obj_add_flag(d, LV_OBJ_FLAG_HIDDEN);
          }

          // Banner apply — MAIN LOOP only (LVGL-safe). Baked presets + up to 10 user "Custom"
          // slots in the storage partition, memory-mapped (no RAM copy). The httpd task only
          // sets volatile intents; every lv_*/NVS/flash mutation happens here (hardened against
          // erase-under-mmap).
          static std::string last_banner = "";
          static int last_sel = -2;                 // force the first apply
          static lv_image_dsc_t custom_dsc;
          static esp_partition_mmap_handle_t mmap_h = 0;
          namespace wd = esphome::web_dashboard;
          // build_custom(slot): COMMIT-THEN-SWAP. Map+validate the target into a SCRATCH handle
          // (magic + fixed dims + CRC every time); only on full success tear down the OLD handle,
          // repoint custom_dsc, and publish gallery_active_slot. On any failure return false with
          // the previous mapping untouched — never leave LVGL pointing into a torn/erased mapping.
          auto build_custom = [&](int slot) -> bool {
            const esp_partition_t *part = esp_partition_find_first(ESP_PARTITION_TYPE_DATA, ESP_PARTITION_SUBTYPE_ANY, "storage");
            if (part == nullptr || slot < 0 || slot >= wd::gallery_slot_cap(part)) return false;
            size_t base = (size_t) slot * wd::SLOT_SPAN;
            uint8_t hdr[16];
            if (esp_partition_read(part, base, hdr, 16) != ESP_OK || memcmp(hdr, "WDB1", 4) != 0) return false;
            uint16_t w = hdr[6] | (hdr[7] << 8), h = hdr[8] | (hdr[9] << 8);
            if (w == 0 || h == 0 || w > 240 || h > 135) return false;   // custom = a variable-size cut-out
            size_t sz = 48 + (size_t) w * h * 3;
            const void *ptr = nullptr;
            esp_partition_mmap_handle_t scratch = 0;
            if (esp_partition_mmap(part, base, sz, ESP_PARTITION_MMAP_DATA, &ptr, &scratch) != ESP_OK) return false;
            // .wdb v2 (hdr[4]>=2): verify CRC32 (reserved[12..16]) over the pixel bytes. v1 legacy
            // (hdr[4]<2) has no CRC -> skip. Every load (no id-cache) so a swap can't trust stale.
            if (hdr[4] >= 2) {
              uint32_t want = hdr[12] | (hdr[13] << 8) | (hdr[14] << 16) | ((uint32_t) hdr[15] << 24);
              const uint8_t *px = (const uint8_t *) ptr + 48;
              size_t nb = (size_t) w * h * 3;
              uint32_t c = 0xFFFFFFFFu;
              for (size_t i = 0; i < nb; i++) { c ^= px[i]; for (int k = 0; k < 8; k++) c = (c & 1) ? (c >> 1) ^ 0xEDB88320u : (c >> 1); }
              c ^= 0xFFFFFFFFu;
              if (c != want) { esp_partition_munmap(scratch); return false; }
            }
            if (mmap_h) esp_partition_munmap(mmap_h);   // success -> swap in the new mapping
            mmap_h = scratch;
            custom_dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
            custom_dsc.header.cf = LV_COLOR_FORMAT_RGB565A8;
            custom_dsc.header.w = w; custom_dsc.header.h = h; custom_dsc.header.stride = (uint32_t)(w * 2);
            custom_dsc.data = (const uint8_t *) ptr + 48;   // pixels start after the 48B header
            custom_dsc.data_size = (uint32_t) w * h * 3;
            wd::gallery_active_slot = slot;   // publish: excluded from the alloc/erase scan
            return true;
          };

          // (B) select/delete + (C) favorite intent + (E) publish gallery_sel/fav are BOARD-AGNOSTIC and MOVED
          // to core.yaml's 500ms housekeeping lambda (so a headless board consumes the httpd gallery intents +
          // persists the selection too). Only the RENDER (D) + the mmap lifecycle stay here; (D) reads
          // banner_preset/bnr_sel that the core consumer now writes. DELETE's mmap release still happens in (D)
          // (below) when it reacts to banner_preset->Battery — gallery_active_slot stays display-owned.

          // (D) render when the effective target changed (preset name, or the custom slot).
          std::string bp = id(banner_preset).state;
          int sel = id(bnr_sel);
          if (bp != last_banner || (bp == "Custom" && sel != last_sel)) {
            last_banner = bp; last_sel = sel;
            bool shown_custom = (bp == "Custom") && build_custom(sel);  // swaps mmap_h on success
            if (shown_custom) {
              // Custom is now a TIGHT CUT-OUT (like baked) -> place bottom-left in the car field.
              lv_obj_set_align(id(banner_img), LV_ALIGN_BOTTOM_LEFT);
              lv_obj_set_pos(id(banner_img), 3, -2);
              lv_img_set_src(id(banner_img), &custom_dsc);
            } else {
              // Baked preset, or a Custom whose slot is gone/invalid -> release any custom mapping
              // (so the alloc scan may reuse it) and draw a baked cut-out anchored bottom-left.
              if (mmap_h) { esp_partition_munmap(mmap_h); mmap_h = 0; }
              wd::gallery_active_slot = -1;
              lv_obj_set_align(id(banner_img), LV_ALIGN_BOTTOM_LEFT);
              lv_obj_set_pos(id(banner_img), 3, -2);
              esphome::image::Image *bimg = id(preset_battery_img);   // Battery = default + fallback
              ${banner_dash_lookup}   // full gallery injects the else-if chain; the 4MB (minimal) master sets it empty -> bimg stays Battery
              lv_img_set_src(id(banner_img), bimg->get_lv_image_dsc());
              if (bp == "Custom") {   // selected slot is dead -> self-heal NVS so we stop retrying it
                id(bnr_sel) = -1;
                id(banner_preset).make_call().set_option("Battery").perform();
              }
            }
            lv_obj_invalidate(id(banner));  // clean full redraw of the banner (no ghost on live swap)
          }
          // (E) publish gallery_sel/gallery_fav for GET /gallery -> MOVED to core.yaml (board-agnostic).


          // Overlay STX helpers (write a label only when its text CHANGES — lv_label_set_text always reallocs, so an
          // unguarded per-tick set churns the tight 8-bit heap; a held "CHARGER OFFLINE" overlay used to degrade the
          // board this way). Ported WITH the merged model so A3 lands the overlay already STX-guarded (A4 then has
          // only the dashboard/pages left). o2 (not o) so it doesn't shadow the status DTO `o`.
          auto stxs = [](lv_obj_t *o2, const char *s){ const char *c = lv_label_get_text(o2); if (c == nullptr || strcmp(c, s) != 0) lv_label_set_text(o2, s); };
          // A4: set-COLOUR-if-changed companion to stxs (lv_obj_set_style_text_color re-invalidates; guard on the
          // RESOLVED lv_color_t via lv_color_eq — NOT the hex token, RGB565 rounds — using the widget's own style as cache).
          auto sclr = [](lv_obj_t *o2, lv_color_t col){ if (!lv_color_eq(lv_obj_get_style_text_color(o2, LV_PART_MAIN), col)) lv_obj_set_style_text_color(o2, col, 0); };
          auto set_ov_clock = [&](lv_obj_t *lbl) {
            char cb[6];
            if (id(sntp_time).now().is_valid()) { auto t = id(sntp_time).now(); snprintf(cb, sizeof(cb), "%02d:%02d", t.hour, t.minute); }
            else { strcpy(cb, "--:--"); }
            stxs(lbl, cb);
          };

          // ==== OVERLAY TAKEOVER (netfault > offline-alert > fault) — ONE state-driven `ov` overlay (A3 Tier-3 merge,
          // backport of CYD display_cyd.yaml:1797-1886). The 3 priority branches STAY: netfault `return`s (terminal),
          // offline + fault FALL THROUGH (the `ov` covers ONLY the dashboard, so other pages stay live + navigable).
          // ADAPTED FOR TTGO (R6): ov_enter must NOT lv_scr_load here (that overflowed the deep draw stack) — it only
          // toggles HIDDEN + glyph/colour; the dashboard is pulled forward by the 500ms housekeeping (netfault force,
          // fault edge-grab, offline saver-suppress), exactly as before. fault_active/offline_alert stay the published
          // GLOBALS (RGB LED / saver / backlight read them, never the ids). `ov_prev` (one enum) replaces the 3 latches.
          enum OvState { OV_NONE, OV_NETFAULT, OV_OFFLINE, OV_FAULT };
          static OvState ov_prev = OV_NONE;
          auto ov_enter = [&](OvState st, const char *glyph, uint32_t accent, bool force_bl) {
            ov_prev = st;
            lv_obj_add_flag(id(live_content), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(ov), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(ov_icon), glyph);
            lv_obj_set_style_text_color(id(ov_icon),  lv_color_hex(accent), 0);
            lv_obj_set_style_text_color(id(ov_title), lv_color_hex(accent), 0);
            lv_obj_set_style_text_opa(id(ov_icon),  LV_OPA_COVER, 0);   // clear any FAULT-flash residue
            lv_obj_set_style_text_opa(id(ov_title), LV_OPA_COVER, 0);
            if (force_bl) { id(backlight_dim) = false; id(backlight).turn_on().set_brightness(wd_bl::eff_backlight(id(backlight_level).state / 100.0f, 0.0f, wd_bl::BlMode::KEEP_LIT)).perform(); }   // fault/netfault: full day, floored (backlight_model.h; no LDR -> darkness 0)
          };

          if (id(netwatch_disabled)) {                          // 1: NETFAULT — breaker tripped, terminal till power-cycle
            if (ov_prev != OV_NETFAULT) {
              id(fault_active) = false;
              ov_enter(OV_NETFAULT, "\U000F0026", 0xf5b942, true);   // amber alert, force bright
              stxs(id(ov_title), "NETWORK FAULT");
              stxs(id(ov_msg), "Please unplug and replug\nthe device to restart.");
              lv_obj_set_style_text_color(id(ov_msg), lv_color_hex(0xe8e8e8), 0);   // explicit white
              lv_obj_add_flag(id(ov_sub), LV_OBJ_FLAG_HIDDEN);       // no ctx line, no clock/demo
              lv_obj_add_flag(id(ov_clock), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(ov_demo), LV_OBJ_FLAG_HIDDEN);
            }
            return;                                             // terminal takeover — nothing else draws
          }

          uint32_t off_el = id(offline_active) ? (now - id(offline_since_ms)) / 1000 : 0;
          bool never_online = (id(last_packet_ms) == 0);
          id(offline_alert) = o.offline && off_el < (never_online ? 100 : 25);   // relax (off_el since offline began @ ble_timeout=20s): a had-signal DROP settles at ~45s total (25s blink), a never-online (setup) unit at ~120s. "Message not disco" — brief blink then calm breathe+hero. (was the 120s offline_alert_s full overlay, at ble_timeout=30.)
          if (id(offline_alert)) {                              // 2: OFFLINE — "CHARGER OFFLINE" (does NOT force backlight)
            if (ov_prev != OV_OFFLINE) {
              id(fault_active) = false;
              ov_enter(OV_OFFLINE, "\U000F00B2", 0xef4444, false);   // bt-off red; backlight dims normally (idle-dim gate)
              stxs(id(ov_title), "CHARGER OFFLINE");
              lv_obj_set_style_text_color(id(ov_msg), lv_color_hex(0x888888), 0);   // offline body = gray
              lv_obj_add_flag(id(ov_sub), LV_OBJ_FLAG_HIDDEN);
              lv_obj_clear_flag(id(ov_clock), LV_OBJ_FLAG_HIDDEN);
            }
            char ob[160];
            if (id(last_packet_ms) == 0) {
              char db[12];
              if (off_el < 60)        snprintf(db, sizeof(db), "%us", (unsigned)((off_el / 15) * 15));   // 15s-quantized (calm, fewer STX reallocs)
              else if (off_el < 3600) snprintf(db, sizeof(db), "%um", (unsigned)(off_el / 60));
              else                    snprintf(db, sizeof(db), "%uh %02um", (unsigned)(off_el / 3600), (unsigned)((off_el % 3600) / 60));
              snprintf(ob, sizeof(ob), "Waiting for charger\n%s", db);   // the "check key/MAC" hint moved to the BLE page (reachable — offline falls through, nav works)
            } else if (age / 60000 >= 1) {
              snprintf(ob, sizeof(ob), "Last seen: %.2fV - %s\n%u minutes ago", o.v, o.word, age / 60000);
            } else {
              snprintf(ob, sizeof(ob), "Last seen: %.2fV - %s\n%us ago", o.v, o.word, (age / 1000 / 15) * 15);   // 15s-quantized
            }
            stxs(id(ov_msg), ob);
            set_ov_clock(id(ov_clock));
            if (id(demo_active)) lv_obj_clear_flag(id(ov_demo), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(ov_demo), LV_OBJ_FLAG_HIDDEN);
            // NO return — OFFLINE FALLS THROUGH like FAULT: the `ov` covers ONLY the dashboard, so on any OTHER page the
            // per-page fills below run ("-" dashes when offline) and nav/menu stays reachable. Chained else-if with FAULT.
          } else if (o.scode == 3 && !o.offline) {              // 3: FAULT — focus takeover (live), FALLS THROUGH
            if (ov_prev != OV_FAULT) {
              id(fault_active) = true;
              ov_enter(OV_FAULT, "\U000F0026", 0xef4444, true);      // red alert, force bright
              stxs(id(ov_title), "FAULT");
              lv_obj_set_style_text_color(id(ov_msg), lv_color_hex(0xe8e8e8), 0);   // fault body = white
              lv_obj_clear_flag(id(ov_sub), LV_OBJ_FLAG_HIDDEN);     // ctx line visible
              lv_obj_clear_flag(id(ov_clock), LV_OBJ_FLAG_HIDDEN);
            }
            std::string fe = (o.err.empty() || o.err == "No error") ? "Charger fault" : o.err;
            stxs(id(ov_msg), fe.c_str());
            char fc[40]; snprintf(fc, sizeof(fc), "%.2f V  -  %s", o.v, o.tstr); stxs(id(ov_sub), fc);
            lv_opa_t fop = ((now / 500) % 2) ? LV_OPA_COVER : (lv_opa_t) 80;   // 2Hz flash (inherently changing -> unguarded, FAULT-only)
            lv_obj_set_style_text_opa(id(ov_icon), fop, 0);
            lv_obj_set_style_text_opa(id(ov_title), fop, 0);
            set_ov_clock(id(ov_clock));
            if (id(demo_active)) lv_obj_clear_flag(id(ov_demo), LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(id(ov_demo), LV_OBJ_FLAG_HIDDEN);
            // NO return — falls through to the header/status/hero render beneath the overlay (as before).
          } else if (ov_prev != OV_NONE) {                      // TEARDOWN — leaving offline OR fault (netfault never reaches here)
            if (ov_prev == OV_FAULT) id(fault_active) = false;
            ov_prev = OV_NONE;
            lv_obj_clear_flag(id(live_content), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(ov), LV_OBJ_FLAG_HIDDEN);
          }

          // render only the visible page each tick (button handler sets current_page before lv_scr_load).
          // UNGATED below: link dot + status word/icon (the saver mirrors them); net chrome runs later.
          const int pg = id(current_page);
          // link dot = BLE link state (mirrored onto link_dot2 on the BLE page). OFFLINE now FALLS THROUGH to here (it
          // used to `return` and set the dots red inside the overlay), so this block must own the offline red bt-off:
          // offline red > stale grey > live blue. Mirrors the CYD header link-dot (display_cyd.yaml:1914-1918).
          const char *dot_glyph; lv_color_t dotc;
          if (o.offline)        { dot_glyph = "\xF3\xB0\x82\xB2"; dotc = lv_color_hex(0xef4444); }   // bt-off red
          else if (o.ble_stale) { dot_glyph = "\xF3\xB0\x82\xB2"; dotc = lv_color_hex(0x888888); }   // bt-off grey
          else                  { dot_glyph = "\xF3\xB0\x82\xAF"; dotc = lv_color_hex(0x38bdf8); }   // bt blue
          stxs(id(link_dot),  dot_glyph); sclr(id(link_dot),  dotc);   // A4: guard (every-tick, every-page). link_dot2
          stxs(id(link_dot2), dot_glyph); sclr(id(link_dot2), dotc);   // compares its OWN state -> stays in lockstep, no desync
          // Ambient offline (the alert phase already returned above): a RED "OFFLINE" + bluetooth-off icon in the
          // status cluster — same colour/word as the Phase-A overlay and the web, just small (the alarm was the
          // full-screen takeover, not the word). bt-off (not the fault "!" alert) keeps offline visually DISTINCT
          // from a charger fault. render_saver mirrors this widget's TEXT AND COLOUR onto the screensaver, so this
          // is what makes the ambient saver read "OFFLINE" instead of the stale pre-drop word in its live colour.
          if (o.offline) {
            stxs(id(status_word), "OFFLINE");
            sclr(id(status_word), lv_color_hex(0xef4444));
            stxs(id(status_icon), "\xF3\xB0\x82\xB2");   // mdi bluetooth-off (distinct from fault's alert glyph)
            sclr(id(status_icon), lv_color_hex(0xef4444));
          } else {
            stxs(id(status_word), o.word);
            sclr(id(status_word), lv_color_hex(o.col_hex));
            stxs(id(status_icon), o.icon);
            sclr(id(status_icon), lv_color_hex(o.col_hex));
          }

          // ---- hero voltage + bar geometry (dashboard only) ----
          // D3 (2026-09-09, backport of the CYD !saver_active guard): these 3 dashboard-ONLY blocks (voltage/gauge,
          // left-aux Elapsed, stat row) write OFF-SCREEN while the screensaver is up (current_page stays 0), and their
          // live values change ~1 Hz -> lv_label_set_text reallocs every tick -> 8-bit-heap fragmenter over the
          // multi-hour saver. Gate them off during the saver; the header/status blocks above stay UNGATED so
          // render_saver's clock/status mirror keeps ticking. (TTGO is heap-richer than the CYD, so this is margin
          // insurance, not a fix for an observed crater — matches the CYD for parity.)
          if (pg == 0 && !id(fault_active) && !id(saver_active)) {
          char vb[8];
          if (o.have && !std::isnan(o.v)) snprintf(vb, sizeof(vb), "%.2f", o.v);   // never-seen / NaN -> "-", not "0.00" or "nan" (mirrors CYD hero + detail guard)
          else                            snprintf(vb, sizeof(vb), "-");
          stxs(id(voltage_val), vb);
          lv_color_t vcol;
          if (o.offline) {
            vcol = lv_color_hex(0x888888);   // ambient offline: grey the last-known number so it can't read as a live in-band value
          } else if (((o.v > o.red_hi && !o.is_recond) || (o.v < o.red_lo && o.have)) || o.scode == 3) {
            vcol = lv_color_hex(0xef4444);
          } else if (o.show_band) {
            vcol = (o.v < o.band_lo - 0.05f || o.v > o.band_hi + 0.05f)
                 ? lv_color_hex(0xf5b942)
                 : lv_color_hex(0x3ddc84);
          } else {
            vcol = lv_color_hex(0xe8e8e8);
          }
          sclr(id(voltage_val), vcol);
          const float VMIN = 9.5f * o.sc, VSPAN = 6.0f * o.sc; const int BW = 222;
          auto px = [&](float volt) {
            float p = (volt - VMIN) / VSPAN; if (p < 0) p = 0; if (p > 1) p = 1;
            return (int)(p * BW);
          };
          int rl = px(o.red_lo);
          lv_obj_set_x(id(redline_low), 0);   lv_obj_set_width(id(redline_low), rl);
          int rh = px(15.0f * o.sc);
          lv_obj_set_x(id(redline_high), rh); lv_obj_set_width(id(redline_high), BW - rh);
          if (o.show_band) {
            lv_obj_clear_flag(id(exp_band), LV_OBJ_FLAG_HIDDEN);
            int bx = px(o.band_lo);
            lv_obj_set_x(id(exp_band), bx);
            lv_obj_set_width(id(exp_band), px(o.band_hi) - bx);
          } else {
            lv_obj_add_flag(id(exp_band), LV_OBJ_FLAG_HIDDEN);
          }
          lv_obj_set_x(id(volt_marker), 9 + px(o.v) - 1);
          }

          // ---- detail box: TOP = raw charger phase (status-coloured) or an amber anomaly (priority);
          //      BOTTOM = muted time-in-status. (dashboard only) ----
          if (pg == 0 && !id(fault_active) && !id(saver_active)) {   // D3: !saver_active — off-screen ~1Hz live writes churn the 8-bit heap during the multi-hour saver
            if (o.offline) {
              // Ambient offline: blank both. The phase + the "Elapsed" time-in-status (status_since_ms only
              // advances while ONLINE) both LIE once offline; the grey "Offline" status word carries the state.
              stxs(id(charger_phase), "");
              stxs(id(anomaly_text), "");
            } else if (!o.note.empty()) {
              // Anomaly OWNS the top line (it can wrap to 2 lines) -> blank the Elapsed line so they can't overlap.
              stxs(id(charger_phase), o.note.c_str());
              sclr(id(charger_phase), lv_color_hex(0xf5b942));
              stxs(id(anomaly_text), "");
            } else {
              // TOP: raw charger phase in the status colour. BOTTOM: muted time-in-status.
              stxs(id(charger_phase), o.raw.c_str());   // raw charger phase; "" -> blank
              sclr(id(charger_phase), lv_color_hex(o.col_hex));
              uint32_t secs = (now - id(status_since_ms)) / 1000;
              char dbuf[16];
              if (secs < 60) snprintf(dbuf, sizeof(dbuf), "%us", (unsigned)secs);
              else if (secs < 3600) snprintf(dbuf, sizeof(dbuf), "%um", (unsigned)(secs / 60));
              else snprintf(dbuf, sizeof(dbuf), "%uh %02um", (unsigned)(secs / 3600), (unsigned)((secs % 3600) / 60));
              char info[24];
              snprintf(info, sizeof(info), "Elapsed %s", dbuf);
              stxs(id(anomaly_text), info);   // stxs on the FINAL string dedupes the in-second repeat
              sclr(id(anomaly_text), lv_color_hex(0x777777));
            }
          }

          // ---- dashboard stats (dashboard only) ----
          if (pg == 0 && !id(fault_active) && !id(saver_active)) {   // D3: !saver_active — off-screen ~1Hz live writes churn the 8-bit heap during the multi-hour saver
            char sb[16];
            snprintf(sb, sizeof(sb), "%.1f A", o.ibat); stxs(id(stat_current_val), sb);
            stxs(id(stat_temp_val), o.tstr);
          }

          // ---- screen 2: charger detail (detail page only) ----
          // NOT !fault_active-gated: the fault overlay lives on page_dashboard only, so with Option B (nav
          // sticks during a fault) the Detail page must keep refreshing live values when viewed mid-fault.
          if (pg == 1) {
            char sb[16];
            // Offline (this page is now reachable while the charger's gone — offline falls through) OR a never-seen
            // charger: dash every value so nothing reads as a live number when there's no live data (Q2 decision).
            if (o.offline || !o.have) {
              stxs(id(detail_temp),  "-");
              stxs(id(detail_volt),  "-");
              stxs(id(detail_curr),  "-");
              stxs(id(detail_power), "-");
            } else {
              stxs(id(detail_temp), o.tstr);
              if (std::isnan(o.v)) stxs(id(detail_volt), "-"); else { snprintf(sb, sizeof(sb), "%.2f V", o.v); stxs(id(detail_volt), sb); }   // Victron 0x7FFF sentinel -> NaN: "-", not "nan V"
              snprintf(sb, sizeof(sb), "%.1f A", o.ibat); stxs(id(detail_curr), sb);
              snprintf(sb, sizeof(sb), "%.0f W", o.pw);   stxs(id(detail_power), sb);
            }
          }

          // ---- screen 3: network + top-bar clock (BLE-independent; also runs while offline) ----
          id(render_net_chrome).execute();

          // ---- BLE (Victron) signal — bars blue/amber/red; grey "No signal" once STEP-1 stale (o.ble_stale). ----
          // NOT !fault_active-gated (Option B): the fault overlay is on page_dashboard only, so this page must
          // stay live when viewed during a fault.
          if (pg == 3) {
          float brssi = (id(victron_rssi).has_state() && !o.ble_stale) ? id(victron_rssi).state : NAN;
          int blit; lv_color_t bwc; const char *bwq;
          if (std::isnan(brssi))    { blit = 0; bwc = lv_color_hex(0x666666); bwq = "No signal"; }
          else if (brssi >= -60)    { blit = 4; bwc = lv_color_hex(0x38bdf8); bwq = "Good"; }
          else if (brssi >= -70)    { blit = 3; bwc = lv_color_hex(0x38bdf8); bwq = "Good"; }
          else if (brssi >= -78)    { blit = 2; bwc = lv_color_hex(0xf5b942); bwq = "Fair"; }
          else                      { blit = 1; bwc = lv_color_hex(0xef4444); bwq = "Poor"; }
          // A4: bg_color has no cheap widget-read compare in the hot path -> bucket-static guard (idiom F): re-paint
          // the 4 bars only when the lit-count OR the colour changed (per-site statics, not shared).
          static int p_blit_t = -1; static lv_color_t p_bwc_t = lv_color_hex(0);
          if (blit != p_blit_t || !lv_color_eq(bwc, p_bwc_t)) {
            p_blit_t = blit; p_bwc_t = bwc;
            lv_obj_t *bbars[4] = { id(ble_bar_0), id(ble_bar_1), id(ble_bar_2), id(ble_bar_3) };
            for (int i = 0; i < 4; i++)
              lv_obj_set_style_bg_color(bbars[i], (i < blit) ? bwc : lv_color_hex(0x333333), 0);
          }
          char bv[28];
          if (std::isnan(brssi)) snprintf(bv, sizeof(bv), "%s", bwq);
          else                   snprintf(bv, sizeof(bv), "%s (%d dBm)", bwq, (int)brssi);
          stxs(id(ble_rssi_val), bv);
          sclr(id(ble_rssi_val), bwc);
          // The "ago" counter only carries value while the signal is going/gone stale (shows HOW LONG it's
          // been bad). When fresh it just ticks 0-2s ("recent") — redundant with the bars + RSSI — so show a
          // static "Live" instead of a jittering number.
          char ab[16];
          if (id(last_packet_ms) == 0) snprintf(ab, sizeof(ab), "-");   // never seen (fresh Live) — not "uptime ago"
          else if (!o.ble_stale)       snprintf(ab, sizeof(ab), "Live");
          else if (age < 60000)        snprintf(ab, sizeof(ab), "%us ago", (unsigned)(age / 1000));
          else                         snprintf(ab, sizeof(ab), "%um ago", (unsigned)(age / 60000));
          stxs(id(ble_age), ab);
          // State-aware BLE hint (backport from CYD display_cyd.yaml:2046-2060). Shown only when there's a reason;
          // reachable now that offline FALLS THROUGH (nav to this page works while offline). DEMO first (the mock
          // producer fakes a healthy link, so any "offline" text would contradict the page); then keys-not-set ->
          // web setup; keys-set-but-never-seen -> check MAC/key; a later drop -> reassuring "reconnecting". STX-swaps
          // on the case-flip only (rare) -> no per-tick realloc. Replaces the inline MAC hint the old overlay carried.
          if (id(demo_active)) {
            stxs(id(ble_hint), "Demo mode\nsimulated data");
            lv_obj_clear_flag(id(ble_hint), LV_OBJ_FLAG_HIDDEN);
          } else if (!id(keys_configured)) {
            stxs(id(ble_hint), "No charger configured\nadd MAC + key in\nthe web dashboard");
            lv_obj_clear_flag(id(ble_hint), LV_OBJ_FLAG_HIDDEN);
          } else if (id(last_packet_ms) == 0) {
            stxs(id(ble_hint), "No data or charger offline\ncheck MAC if newly paired\nor plug in the charger");
            lv_obj_clear_flag(id(ble_hint), LV_OBJ_FLAG_HIDDEN);
          } else if (o.offline) {
            stxs(id(ble_hint), "Charger went offline\ncheck it's powered / in range\nreconnecting...");
            lv_obj_clear_flag(id(ble_hint), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(ble_hint), LV_OBJ_FLAG_HIDDEN);
          }
          }

  # --- Hold-to-confirm bar: advance while S2 is held on a hold row (200ms). Reboot (sel 0) = 2s;
  # Reset WiFi (sel 1) = 3s; Factory reset (sel 2) = 5s. On completion fire the matching action. ----
  - interval: 200ms
    then:
      - lambda: |-
          if (id(in_menu) && (id(menu_sel) == 0 || id(menu_sel) == 1 || id(menu_sel) == 2) && id(s2_hold_ms) > 0) {
            id(last_activity_ms) = millis();           // keep the screen awake mid-hold
            uint32_t target = (id(menu_sel) == 2) ? 5000UL : (id(menu_sel) == 1) ? 3000UL : 2000UL;
            uint32_t held = millis() - id(s2_hold_ms);
            int pct = (int)(held * 100UL / target);
            if (pct > 100) pct = 100;
            lv_bar_set_value(id(reset_bar), pct, LV_ANIM_OFF);
            if (held >= target) {                      // held long enough -> execute
              id(s2_hold_ms) = 0;
              if (id(menu_sel) == 2) id(sys_factory_reset).press();
              else if (id(menu_sel) == 1) id(sys_wifi_reset).press();
              else id(sys_restart).press();            // sel 0 = Reboot
            }
          }

  # --- Display housekeeping (500ms; display-only; S4b-2b) ------------------------------------
  - interval: 500ms
    then:
      - lambda: |-
          // --- Display housekeeping (S4b-2b): splash exit + AP setup-screen swap + saver/auto-return/backlight +
          //     sys labels. All lv_*. The SYSTEM half (wifi_reset/AP-latch/post_onboard/demo-publish) is in core. ---
          static bool disp_ap_shown = false;   // display one-shot for the setup screen (ap_setup_shown is core-owned now)
          // A1: every branch below MUTATES STATE ONLY (current_page / saver_active); the SINGLE load happens via
          // id(wd_load_screen) at the end (kept in this shallow 500ms loop, never the deep 500ms draw lambda — R6).
          // Boot splash handoff: time the EXIT + suppress everything (return) while it plays.
          if (id(splash_active)) {
            if ((uint32_t)(millis() - id(splash_start_ms)) < 3800) {
              return;   // still splashing: do NOT reload (the on_boot splash anim keeps playing)
            }
            id(splash_active) = false;
            id(current_page) = 0;   // loader picks setup (via ap_setup_shown) or dashboard; then fall through
            if (wifi::global_wifi_component->is_ap_active()) disp_ap_shown = true;   // sync the display latch (core sets ap_setup_shown separately)
          }
          bool ap = wifi::global_wifi_component->is_ap_active();
          uint32_t inact = millis() - id(last_activity_ms);
          uint32_t ret_ms = (uint32_t)id(return_timeout).state * 1000UL;
          // Dim must never fire before the auto-return, else the screen dims on a detail page and you never see it
          // returned. Clamp dim >= return regardless of how the stored values got there.
          float dim_s = fmaxf(id(dim_timeout).state, id(return_timeout).state);
          uint32_t dim_ms = (uint32_t)(dim_s * 1000.0f);
          // AP setup + a NETWORK-FAULT degrade keep the screen lit (like a fault) so the instruction stays readable.
          bool keep_lit = id(fault_active) || id(serious_warn_active) || ap || id(netwatch_disabled);
          if (id(netwatch_disabled)) {
            // ---- NETWORK-FAULT degrade takeover: keep the merged `ov` overlay (a page_dashboard child) VISIBLE ----
            // Force the dashboard (loader loads it since current_page=0, saver off), keep lit, and SKIP the whole
            // idle chain so the saver never covers it + the backlight never dims. (netwatch_disabled only latches at
            // boot + never clears without a reboot, so this is stable.) It wins because it runs before the idle else.
            id(saver_active) = false; id(current_page) = 0;
          } else {
            // Wi-Fi setup-screen swap: react to the core-owned ap_setup_shown latch (edge via disp_ap_shown for the
            // menu teardown; the LOADER itself keys off ap_setup_shown so no lv_scr_load here). <=500ms lag is fine.
            if (id(ap_setup_shown) && !disp_ap_shown) {
              disp_ap_shown = true;
              if (id(in_menu)) { id(in_menu) = false; id(s2_hold_ms) = 0; id(render_sys_menu).execute(); }
              id(saver_active) = false; id(current_page) = 0;
            } else if (!id(ap_setup_shown) && disp_ap_shown) {
              disp_ap_shown = false; id(current_page) = 0;
            }
            // Screensaver suppress: a fault / serious warning / AP / the OFFLINE ALERT phase wants the data screen.
            // (Ambient offline, past the alert window, is NOT a suppressor — the saver then shows the banner + a quiet
            // "Offline".) The overlay lives on the dashboard, so current_page=0 brings it forward.
            if (id(saver_active) && (keep_lit || id(offline_alert))) {
              id(saver_active) = false; id(current_page) = 0;
            }
            // Fault nav: a FAULT must be visible even from a sub-page, so on a NEW fault EDGE grab attention ONCE.
            // We do NOT reassert every tick — after the one grab the user can still reach System/Reboot during a fault
            // (the legacy auto-return below stays !fault_active-gated). Re-raises only on a fresh edge; the merged `ov`
            // overlay lives on page_dashboard so it re-shows whenever nav returns to page 0. NOTE: fault_active is WRITTEN in the
            // draw lambda + SAMPLED here — intentional (the ~500ms lag is why an offline-sandwiched re-fault re-grabs).
            static bool prev_fault = false;
            bool fault_edge = id(fault_active) && !prev_fault;
            prev_fault = id(fault_active);
            if (fault_edge && !ap && id(current_page) != 0) {
              id(current_page) = 0;
              if (id(in_menu)) { id(in_menu) = false; id(s2_hold_ms) = 0; id(render_sys_menu).execute(); }
            }
            // Screensaver ENTER (idle view): populate now so the loader shows a ready frame this same tick.
            if (!id(saver_active) && inact > ret_ms && !keep_lit && !id(offline_alert)) {
              if (id(in_menu)) { id(in_menu) = false; id(s2_hold_ms) = 0; id(render_sys_menu).execute(); }
              id(render_saver).execute();       // populate before showing
              id(saver_active) = true;
            }
            // Legacy auto-return to the dashboard — only when the saver is suppressed (keeps FAULT/warning/offline
            // behaviour: still return there from a sub-page).
            if (inact > ret_ms && id(current_page) != 0 && !id(fault_active) && !id(saver_active) && !ap) {
              id(current_page) = 0;
              if (id(in_menu)) { id(in_menu) = false; id(s2_hold_ms) = 0; id(render_sys_menu).execute(); }
            }
          }
          // A1: the SINGLE load site — resolves saver > AP-setup > page from the state the ladder just set.
          id(wd_load_screen).execute();
          if (id(saver_active)) id(render_saver).execute();   // keep the saver's mirror fresh
          // A2: one-shot HEAP RECLAIM — destroy the boot-only pages once done (~4-5KB DRAM). Runs AFTER the loader so the
          // deleted page is guaranteed NOT the active screen (LVGL v9.5: never delete act_scr). Safe exactly as on the CYD
          // (display_cyd.yaml:1593-1611): splash_active is monotonic + the loader has no splash case (default->dashboard);
          // page_setup is boot-only (core.yaml ap_timeout:0s -> the AP NEVER auto-raises mid-session; Reset-WiFi = reboot,
          // which rebuilds the whole tree). More headroom than the CYD so less urgent, but the same win + free-safe.
          static bool splash_freed = false;
          if (!splash_freed && !id(splash_active)) {          // handoff done; loader already swapped away from splash
            splash_freed = true;
            lv_obj_del(id(page_splash)->obj);
            id(page_splash)->obj = nullptr;                   // a stray ref then hits nullptr, not freed memory
          }
          static bool setup_freed = false;
          if (!setup_freed && millis() > 60000UL && !id(ap_setup_shown) &&
              wifi::global_wifi_component != nullptr && !wifi::global_wifi_component->is_ap_active()) {
            setup_freed = true;
            lv_obj_del(id(page_setup)->obj);
            id(page_setup)->obj = nullptr;
          }
          // Backlight ladder — single-sourced in backlight_model.h (wd_bl::eff_backlight), UNIFIED with the CYD.
          // `day` = the manual "Backlight" ceiling (backlight_level, slider min 30% so always readable). The TTGO
          // has NO LDR -> darkness is a fixed 0 (auto-dim permanently off = "the CYD dim model with ldr_enabled
          // false"; the night curve is dormant but the model reads identically). ACTIVE/keep-lit ride eff_backlight
          // (MIN_READABLE floor + the future ha_max clamp slot). idle-dim target = DIM_FRAC[level]*day, floored.
          float day = id(backlight_level).state / 100.0f;
          float darkness = 0.0f;   // TTGO has no LDR -> always day-bright (auto-dim off)
          // User idle-dim level (0=OFF|1=LOW|2=MED|3=HIGH) -> the idle fraction of day. OFF = panel fully dark
          // (turn_off). NOTE: the TTGO has NO status LED, so OFF leaves a fully BLANK screen (no glance indicator) —
          // a deliberate user choice; default is MED. LOW/MED/HIGH ride eff_backlight (darkness-corrected + the
          // MIN_READABLE floor). Mirrors the CYD idle_dim_level model (display_cyd.yaml:1509-1521).
          int dimlvl = id(idle_dim_level); if (dimlvl < 0) dimlvl = 0; if (dimlvl > 3) dimlvl = 3;
          static const float DIM_FRAC[4] = {0.0f, 0.30f, 0.50f, 0.70f};   // OFF | LOW | MED | HIGH (idle = frac*day)
          float active = wd_bl::eff_backlight(day, darkness, keep_lit ? wd_bl::BlMode::KEEP_LIT : wd_bl::BlMode::ACTIVE);
          float idle   = wd_bl::eff_backlight(day, darkness, wd_bl::BlMode::IDLE, 1.0f, DIM_FRAC[dimlvl]);
          // A FAULT or a SERIOUS warning (over/undervoltage) keeps the screen lit — and WAKES a
          // dimmed one — so it draws attention. The saver dims normally (idle view before sleep).
          if (keep_lit) {
            id(backlight_dim) = false;
          } else if (inact > dim_ms && !id(backlight_dim)) {
            id(backlight_dim) = true;
            if (dimlvl == 0) id(backlight).turn_off().perform();               // OFF -> panel fully dark (no LED on the TTGO); wakes via turn_on() in input_tdisplay_2btn + the active branch
            else id(backlight).turn_on().set_brightness(idle).perform();
          }
          // Live-apply the active backlight level (also wakes from dim + drives the keep-lit case).
          // Only touches the light when the target actually changed.
          static float last_active = -1.0f;
          if (!id(backlight_dim)) {
            if (active != last_active) { last_active = active; id(backlight).turn_on().set_brightness(active).perform(); }
          } else {
            last_active = -1.0f;  // force re-apply on the next wake
          }
          // (demo_mode publish-on-change moved to the CORE 500ms — S4b-2b — so headless keeps it fresh.)

          // --- System screen info: uptime (version is static; heap -> web) ---
          uint32_t up = millis() / 1000;
          char ub[20];
          if (up < 3600) snprintf(ub, sizeof(ub), "%um %us", up / 60, up % 60);
          else           snprintf(ub, sizeof(ub), "%uh %um", up / 3600, (up % 3600) / 60);
          lv_label_set_text(id(sys_uptime), ub);
          // Real hostname (once) — App.get_name() carries the mac-suffix when it's enabled, so this stays
          // correct on both the dev bin (winterdash.local) and the generic bin (winterdash-a1b2c3.local).
          static bool host_set = false;
          if (!host_set) {
            host_set = true;
            std::string h = App.get_name().c_str(); h += ".local";
            lv_label_set_text(id(sys_hostname), h.c_str());
          }

# --- Boot splash (display-only; S4b-2b). prio -100, all lv_*. The core seed/hostname/charge-log
# on_boot(-100) is in core.yaml. ---
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(last_activity_ms) = millis();
            // A5: re-point LVGL's font glyph-buffer alloc to a static buffer BEFORE the first paint (lv_refr_now
            // below) -> glyph rasterization never mallocs from the fragmentable 8-bit heap (NULL-deref crater
            // mitigation; memory esphome-lvgl-glyph-buffer-null-deref). Mirror of the CYD splash install.
            wd_font_buf::install();
            // Boot splash — set up HERE (on_boot -100), not the 500ms loop's first tick, so the entrance
            // starts right after boot instead of ~0.5s later. The display is up by now (prio 600 > -100),
            // and SPI is blocking, so: load page_splash, synchronously flush it BLACK while the backlight is
            // still OFF (light restore_mode ALWAYS_OFF) -> no flash of the frame the LCD retained across a
            // reset; then light it up and start the fades. Fade only (no zoom transform — that "snowed" the
            // logo edges on the alpha-less RGB565 mark). lv_anim is fine in this shallow lambda. ~4s total.
            lv_scr_load(id(page_splash)->obj);
            lv_refr_now(NULL);
            id(backlight).turn_on().set_brightness(wd_bl::eff_backlight(id(backlight_level).state / 100.0f, 0.0f, wd_bl::BlMode::ACTIVE)).perform();   // through the ladder (single-source; identical here since backlight_level>=30%)
            id(splash_start_ms) = millis();
            {
              lv_anim_t am; lv_anim_init(&am);                       // mark: fade in 0-700ms
              lv_anim_set_var(&am, id(splash_mark));
              lv_anim_set_values(&am, 0, 255);
              lv_anim_set_time(&am, 700);
              lv_anim_set_exec_cb(&am, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&am);
              lv_anim_t aw; lv_anim_init(&aw);                       // wordmark: fade in 1100-1700ms
              lv_anim_set_var(&aw, id(splash_wm));
              lv_anim_set_values(&aw, 0, 255);
              lv_anim_set_time(&aw, 600);
              lv_anim_set_delay(&aw, 1100);
              lv_anim_set_exec_cb(&aw, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&aw);
              lv_anim_t af; lv_anim_init(&af);                       // lockup: hold, fade out 3300-3800ms
              lv_anim_set_var(&af, id(splash_box));
              lv_anim_set_values(&af, 255, 0);
              lv_anim_set_time(&af, 500);
              lv_anim_set_delay(&af, 3300);
              lv_anim_set_exec_cb(&af, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&af);
            }
