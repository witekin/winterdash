    # BOOT SPLASH — brand entrance (~2.6s) then hands off to the dashboard.
    # FIRST page = shown at power-on. NOT in the page cycle (PAGES[]={0,1,3,4,5}) (like page_setup).
    # mark + two-tone wordmark start at opa 0 (black); the 500ms loop fades/zooms
    # them in (lv_anim), holds, fades the lockup out, then lv_scr_loads the
    # dashboard (or page_setup if the AP is up). Stacked = variant A (matches the
    # setup screen). Composition derives from the vector master — re-export the
    # mark at other sizes for the CYD (240x320) port; do not redraw per board.
    # -------------------------------------------------------------------------
    - id: page_splash
      bg_color: 0x0a0a0a
      bg_opa: COVER
      widgets:
        - obj:
            id: splash_box
            align: CENTER
            x: 0
            y: 0
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [s_transp]
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 6
            widgets:
              - image:
                  id: splash_mark
                  src: winterdash_mark_lg_img   # bigger splash mark (B, ~66px); resize on the image entry
                  opa: 0%          # faded in by on_boot (opacity only — deliberately no zoom transform)
              - obj:
                  id: splash_wm
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [s_transp]
                  scrollbar_mode: "OFF"
                  opa: 0%          # faded in a beat (~200ms) after the mark
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    pad_column: 0
                  widgets:
                    - label: { text: "Winter", text_font: montserrat_26, text_color: 0xeaf4ff }
                    - label: { text: "Dash", text_font: montserrat_26, text_color: 0x38bdf8 }
