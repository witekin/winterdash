# =============================================================================
# display_tdisplay.yaml — TTGO T-Display UI layer
# -----------------------------------------------------------------------------
# Everything that draws on the 240x135 LCD: the mipi_spi display driver, baked
# images (banner presets + QR + brand marks), MDI fonts, the LVGL page tree, the
# render scripts, and the display-only config entities (banner_preset select +
# the backlight/timeout number: settings). A headless board omits this whole file
# (screen dark, web/HA still live); a CYD board swaps it for display_cyd.yaml.
#
# NOTE: the 250/500/200 ms render intervals + the on_boot splash still live in
# the master; the heavy compute/draw split is handled in core.yaml. This file
# holds the static UI + scripts.
#
# IDs here (page_*, banner_img, splash_*, backlight settings, render_*) are
# referenced by the master's render intervals via global id() — that is why the
# headless cut is a COMPILE error (dangling id, R3) unless the render code is also
# gone. Do not rename any entity name: (R1 object_id contract).
# =============================================================================

substitutions:
  # Screen boards only: once the charger has been offline (a had-signal drop) for this long, the full-screen
  # "CHARGER OFFLINE" alert relaxes into the ambient idle flow (screensaver = the car banner + a quiet "Offline"
  # tag) — so a deliberately-unplugged charger in a garage isn't a permanent red alarm. A never-online device
  # (never paired) keeps the full overlay indefinitely. Dev-tunable; a master may override.
  offline_alert_s: "120"

display:
  # mipi_spi T-DISPLAY model: LVGL-native driver with hardware rotation, correct
  # offsets (52/40) and invert_colors for this panel. cs_pin(5)/dc_pin(16) come
  # from the model; backlight is NOT claimed here (we drive GPIO4 via ledc).
  - platform: mipi_spi
    model: T-DISPLAY
    id: tft
    reset_pin: 23
    update_interval: never

image:
  # Baked banner presets — transparent WebP cut-outs (converter output). Flash-only (read directly by
  # LVGL) — no DRAM cost. resize = the left car-field budget (status word starts ~x120); ESPHome fits
  # within WxH preserving aspect. The device never scales at runtime. Battery = default + fallback.
  - file: images/battery.webp
    id: preset_battery_img
    type: RGB
    transparency: alpha_channel
    resize: 112x52
  # Screensaver-size bakes (bigger; the saver shows a prominent centred hero — mirrors how Custom
  # banners bake a big saver size). render_saver picks these by name. Device never scales at runtime.
  - file: images/battery.webp
    id: preset_battery_saver_img
    type: RGB
    transparency: alpha_channel
    resize: 216x88
  # Wi-Fi onboarding QR (baked, RGB565 straight from flash -> 0 DRAM, like the presets above).
  # Encodes the OPEN fallback AP "WinterDashAP" as a Wi-Fi-join code: scanning it joins the AP,
  # then the captive portal pops the setup page. 111x111 native (no runtime resize -> crisp modules).
  # Regenerate after an SSID change: python esphome/tools/gen_setup_qr.py
  - file: images/wifi_setup_qr.png
    id: wifi_setup_qr_img
    type: RGB565
  # WinterDash brand mark (snowflake + charging cable) for the setup-screen hero. Rasterised from
  # assets/brand/winterdash-mark.svg (canonical vector master) via a browser canvas at 28px on the screen
  # bg (#0a0a0a) so the ice gradient + AA composite cleanly; baked RGB565 from flash -> 0 DRAM. Sized for
  # 240x135; the same master re-exports at other sizes for the CYD (240x320) / web later.
  - file: images/winterdash_mark.png
    id: winterdash_mark_img
    type: RGB565
  # Bigger BOOT-SPLASH mark (variant B, ~66px). Same brand mark, but from a hi-res raster
  # (winterdash_mark_hi.png = assets/brand/winterdash-mark.svg rendered via resvg at 132px onto the
  # #0a0a0a splash bg) so ESPHome can downscale it crisply. The 40px winterdash_mark_img above stays the
  # SETUP-screen hero (shared no more). To try "hero" size C, bump this resize to 88x88 (+ wordmark 32).
  - file: images/winterdash_mark_hi.png
    id: winterdash_mark_lg_img
    type: RGB565
    resize: 66x66

# Material Design Icons (Apache-2.0, bundled in fonts/) — only the glyphs we use.
font:
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_18
    size: 18
    bpp: 4
    glyphs:
      - "\U000F0241"  # flash (voltage)
      - "\U000F05E0"  # check-circle (charged)
      - "\U000F0026"  # alert (fault)
      - "\U000F0904"  # power-sleep (idle)
      - "\U000F050F"  # thermometer
      - "\U000F095C"  # current-dc
      - "\U000F029A"  # gauge (power)
      - "\U000F00B2"  # bluetooth-off (ambient-offline status_icon)
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_14
    size: 14
    bpp: 4
    glyphs:
      - "\U000F00AF"  # bluetooth
      - "\U000F00B2"  # bluetooth-off
      - "\U000F05A9"  # wifi
      - "\U000F01D9"  # dots-vertical (kebab — "actions" hint on the System screen)
      - "\U000F0241"  # flash (charging) — charge-log row icons
      - "\U000F05E0"  # check-circle (charged)
      - "\U000F0026"  # alert (fault)
      - "\U000F0904"  # power-sleep (off / powered on)
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_16
    size: 16
    bpp: 4
    glyphs:
      - "\U000F00AF"  # bluetooth
      - "\U000F00B2"  # bluetooth-off
      - "\U000F095C"  # current-dc
      - "\U000F050F"  # thermometer
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_32
    size: 32
    bpp: 4
    glyphs:
      - "\U000F0026"  # alert
      - "\U000F00B2"  # bluetooth-off

# (Banner preset select lives in core.yaml — it is board-agnostic: the WEB hero is driven by its
# SSE state on every board, incl. headless. This display package only READS id(banner_preset).state in
# the draw loop + applies the LVGL image from the main-loop interval.)

# --- Display settings (runtime, NVS) -----------------------------------------
# Replace the compile-time ${...} substitutions; housekeeping/render read these.
number:
  - platform: template
    id: dim_timeout
    name: "Dim timeout"
    entity_category: config
    disabled_by_default: true   # set via web; declutter HA 
    optimistic: true
    restore_value: true
    initial_value: 60          # dim AFTER the auto-return (housekeeping clamps to >= return)
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: "s"
    mode: box
  # name -> object_id must equal the C++ id (no hyphen), so the web REST/SSE ids match.
  - platform: template
    id: return_timeout
    name: "Return timeout"
    entity_category: config
    disabled_by_default: true   # set via web; declutter HA 
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: dim_level
    name: "Dim level"
    entity_category: config
    disabled_by_default: true   # set via web; declutter HA 
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 100             # effective max is backlight_level (clamped in firmware + web)
    step: 5
    unit_of_measurement: "%"
    mode: slider               # HA: drag brightness (% levels only; timeouts stay box)
  # Active backlight brightness (when you interact). Dim level can't exceed this.
  - platform: template
    id: backlight_level
    name: "Backlight level"
    entity_category: config
    disabled_by_default: true   # set via web; declutter HA 
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 30
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider               # HA: drag brightness (% levels only; timeouts stay box)

# --- Victron pairing — stored in NVS, used by victron_ble --------------------
# MAC identifies the device (filter); bindkey (32 hex) decrypts. keys_configured is
# derived from both being non-empty and drives Auto → Live.

# System actions menu rendering (called from the button handlers + hold interval; all in
# the main loop, so lv_* is safe here). Highlights the selected row / the "< Back" header.
script:
  - id: render_sys_menu
    then:
      - lambda: |-
          bool m = id(in_menu);
          int sel = id(menu_sel);
          if (m) { lv_obj_add_flag(id(sys_info), LV_OBJ_FLAG_HIDDEN); lv_obj_clear_flag(id(sys_menu), LV_OBJ_FLAG_HIDDEN); }
          else   { lv_obj_clear_flag(id(sys_info), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag(id(sys_menu), LV_OBJ_FLAG_HIDDEN); }
          // Menu order: 0 Reboot / 1 Reset WiFi / 2 Factory reset / 3 Back(header).
          // Header doubles as the "< Back" item: blue text + subtle bg shift when selected.
          bool back = (m && sel == 3);
          lv_label_set_text(id(sys_title), back ? "< Back" : "System");
          lv_obj_set_style_text_color(id(sys_title), lv_color_hex(back ? 0x38bdf8 : 0xdddddd), 0);
          lv_obj_set_style_bg_color(id(sys_header), lv_color_hex(back ? 0x18222e : 0x1a1d24), 0);
          // Options: flat rows (match the app); selected = subtle bg + accent text
          // (blue Reboot / amber Reset WiFi / danger-red Factory reset).
          bool r = (m && sel == 0), w = (m && sel == 1), f = (m && sel == 2);
          lv_obj_set_style_bg_opa(id(opt_reboot),  r ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          lv_obj_set_style_text_color(id(lbl_reboot),  lv_color_hex(r ? 0x38bdf8 : 0xcccccc), 0);
          lv_obj_set_style_bg_opa(id(opt_wifi), w ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          lv_obj_set_style_text_color(id(lbl_wifi), lv_color_hex(w ? 0xf5b942 : 0xcccccc), 0);
          lv_obj_set_style_bg_opa(id(opt_factory), f ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
          lv_obj_set_style_text_color(id(lbl_factory), lv_color_hex(f ? 0xef5350 : 0xcccccc), 0);
          // Soft-key hint (bottom-left, near S2). Info: kebab + "Actions". In-menu: teach the
          // buttons. Blank + icon hidden during a hold (the progress bar takes over).
          if (!m) {
            lv_obj_clear_flag(id(sys_hint_icon), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(sys_ctrlhint), "Actions");
          } else if (id(s2_hold_ms) > 0) {
            lv_obj_add_flag(id(sys_hint_icon), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(sys_ctrlhint), "");
          } else {
            lv_obj_add_flag(id(sys_hint_icon), LV_OBJ_FLAG_HIDDEN);
            lv_label_set_text(id(sys_ctrlhint), "S1 move   S2 select");
          }
          // Hold-to-confirm bar: shown for ALL THREE hold rows (Reboot=0, Reset WiFi=1, Factory reset=2);
          // the label + colour say which is arming (blue reboot / amber wifi / red factory).
          if (id(s2_hold_ms) > 0 && (sel == 0 || sel == 1 || sel == 2)) {
            const char *hl = (sel == 0) ? "Hold S2 to reboot..." : (sel == 1) ? "Hold S2 to reset WiFi..." : "Hold S2 to factory reset...";
            lv_label_set_text(id(reset_bar_label), hl);
            lv_obj_set_style_text_color(id(reset_bar_label), lv_color_hex(sel == 0 ? 0x38bdf8 : sel == 1 ? 0xf5b942 : 0xef5350), 0);
            lv_obj_clear_flag(id(reset_bar_wrap), LV_OBJ_FLAG_HIDDEN);
          } else { lv_obj_add_flag(id(reset_bar_wrap), LV_OBJ_FLAG_HIDDEN); lv_bar_set_value(id(reset_bar), 0, LV_ANIM_OFF); }

  # Clock + WiFi/SSID/IP/HA are independent of the BLE charger link, so they must keep
  # updating even during the BLE-offline takeover (the content lambda early-returns there).
  # Called from both the online path and the offline branch so the Network screen + top-bar
  # clock never freeze just because the charger went offline.
  - id: render_net_chrome
    then:
      - lambda: |-
          // ---- clock ----
          if (id(sntp_time).now().is_valid()) {
            auto t = id(sntp_time).now();
            char cb[6];
            snprintf(cb, sizeof(cb), "%02d:%02d", t.hour, t.minute);
            lv_label_set_text(id(clock_label), cb);
            lv_label_set_text(id(offline_clock), cb);   // overlays cover the top-bar clock -> mirror it
            lv_label_set_text(id(fault_clock), cb);
          } else {
            lv_label_set_text(id(clock_label), "--:--");
            lv_label_set_text(id(offline_clock), "--:--");
            lv_label_set_text(id(fault_clock), "--:--");
          }
          // ---- WiFi signal (Network screen) ----
          lv_label_set_text(id(wifi_icon), "\xF3\xB0\x96\xA9");  // mdi wifi
          float rssi = id(wifi_rssi).has_state() ? id(wifi_rssi).state : NAN;
          int lit; lv_color_t wc; const char *wq;
          if (std::isnan(rssi))      { lit = 0; wc = lv_color_hex(0x666666); wq = "No signal"; }
          else if (rssi >= -60)      { lit = 4; wc = lv_color_hex(0x3ddc84); wq = "Good"; }
          else if (rssi >= -68)      { lit = 3; wc = lv_color_hex(0x3ddc84); wq = "Good"; }
          else if (rssi >= -75)      { lit = 2; wc = lv_color_hex(0xf5b942); wq = "Fair"; }
          else                       { lit = 1; wc = lv_color_hex(0xef4444); wq = "Poor"; }
          lv_obj_set_style_text_color(id(wifi_icon), wc, 0);
          lv_obj_t *bars[4] = { id(wifi_bar_0), id(wifi_bar_1), id(wifi_bar_2), id(wifi_bar_3) };
          for (int i = 0; i < 4; i++)
            lv_obj_set_style_bg_color(bars[i], (i < lit) ? wc : lv_color_hex(0x333333), 0);
          char wv[28];
          if (std::isnan(rssi)) snprintf(wv, sizeof(wv), "%s", wq);
          else                  snprintf(wv, sizeof(wv), "%s (%d dBm)", wq, (int)rssi);
          lv_label_set_text(id(wifi_val), wv);
          lv_obj_set_style_text_color(id(wifi_val), wc, 0);
          // ---- SSID / IP / HA ----
          lv_label_set_text(id(net_ssid),
              id(wifi_ssid_txt).has_state() && !id(wifi_ssid_txt).state.empty()
              ? id(wifi_ssid_txt).state.c_str() : "-");
          lv_label_set_text(id(net_ip),
              id(wifi_ip_txt).has_state() && !id(wifi_ip_txt).state.empty()
              ? id(wifi_ip_txt).state.c_str() : "-");
          if (id(ha_connected).state) {
            lv_label_set_text(id(ha_val), LV_SYMBOL_OK);
            lv_obj_set_style_text_color(id(ha_val), lv_color_hex(0x3ddc84), 0);
          } else {
            lv_label_set_text(id(ha_val), LV_SYMBOL_CLOSE);
            lv_obj_set_style_text_color(id(ha_val), lv_color_hex(0xef4444), 0);
          }

  # Screensaver content = a MIRROR of the live dashboard (top-bar chrome + status + banner). No
  # recompute — copy text/color/flag/src straight off the dashboard widgets, so the saver can never
  # drift out of sync. Called while the saver is up + once right before it's shown.
  - id: render_saver
    then:
      - lambda: |-
          // clock + status: mirror straight off the live dashboard widgets (no recompute)
          lv_label_set_text(id(saver_clock_label), lv_label_get_text(id(clock_label)));
          lv_label_set_text(id(saver_status_word), lv_label_get_text(id(status_word)));
          lv_obj_set_style_text_color(id(saver_status_word), lv_obj_get_style_text_color(id(status_word), LV_PART_MAIN), 0);
          lv_label_set_text(id(saver_status_icon), lv_label_get_text(id(status_icon)));
          lv_obj_set_style_text_color(id(saver_status_icon), lv_obj_get_style_text_color(id(status_icon), LV_PART_MAIN), 0);
          // banner: CUSTOM -> mmap the selected slot's R_SAVER cut-out (baked at a big saver size by
          // the converter, so no scaling); BAKED -> reuse the dashboard's baked dsc. Both are tight
          // cut-outs -> just centre native (no autocrop). Recompute only when preset/slot changes.
          namespace wd = esphome::web_dashboard;
          std::string sbp = id(banner_preset).state;
          int ssel = id(bnr_sel);
          static std::string last_sbp = "\x01";
          static int last_ssel = -999;
          static lv_image_dsc_t saver_dsc;
          static esp_partition_mmap_handle_t saver_mmap = 0;
          if (sbp != last_sbp || (sbp == "Custom" && ssel != last_ssel)) {
            last_sbp = sbp; last_ssel = ssel;
            const lv_image_dsc_t *show = nullptr;
            if (sbp == "Custom" && ssel >= 0 && ssel < wd::gallery_slot_cap()) {
              const esp_partition_t *part = esp_partition_find_first(ESP_PARTITION_TYPE_DATA, ESP_PARTITION_SUBTYPE_ANY, "storage");
              size_t base = (size_t) ssel * wd::SLOT_SPAN + wd::R_SAVER;
              uint8_t hdr[16];
              if (part != nullptr && esp_partition_read(part, base, hdr, 16) == ESP_OK && memcmp(hdr, "WDB1", 4) == 0) {
                uint16_t w = hdr[6] | (hdr[7] << 8), h = hdr[8] | (hdr[9] << 8);
                if (w > 0 && h > 0 && w <= 240 && h <= 135) {
                  size_t sz = 48 + (size_t) w * h * 3;
                  const void *ptr = nullptr;
                  if (saver_mmap) { esp_partition_munmap(saver_mmap); saver_mmap = 0; }
                  if (esp_partition_mmap(part, base, sz, ESP_PARTITION_MMAP_DATA, &ptr, &saver_mmap) == ESP_OK) {
                    saver_dsc.header.magic = LV_IMAGE_HEADER_MAGIC;
                    saver_dsc.header.cf = LV_COLOR_FORMAT_RGB565A8;
                    saver_dsc.header.w = w; saver_dsc.header.h = h; saver_dsc.header.stride = (uint32_t)(w * 2);
                    saver_dsc.data = (const uint8_t *) ptr + 48;
                    saver_dsc.data_size = (uint32_t) w * h * 3;
                    show = &saver_dsc;
                  }
                }
              }
            }
            if (show == nullptr) {   // baked preset (or a custom miss) -> the big screensaver-size bake
              esphome::image::Image *sv = id(preset_battery_saver_img);   // Battery = default + fallback
              ${banner_saver_lookup}   // full gallery injects the else-if chain; the 4MB (minimal) master sets it empty -> sv stays Battery
              show = sv->get_lv_image_dsc();
            }
            if (show != nullptr) {
              lv_img_set_src(id(saver_img), show);
              int w = show->header.w, h = show->header.h;
              lv_obj_set_pos(id(saver_img), (240 - w) / 2, 60 - h / 2);   // centre in the hero area
            }
          }

# =============================================================================
# LVGL UI
# =============================================================================
lvgl:
  # RAM probe: mipi_spi does hardware rotation, so a partial buffer is fine here
  # (the old noise was a software-rotation artifact). Smaller buffer frees DRAM for
  # the BLE stack + web_server.
  buffer_size: 25%   # 12% HUNG the device at boot (dark screen, off-network, silent serial) — reverted.
                     # The mipi_spi/LVGL draw buffer has a practical floor on this board; if we retry a
                     # smaller buffer for DRAM headroom, step down gently (e.g. 20%) + verify boot, don't halve.
  default_font: montserrat_12
  rotation: 270
  # Shared LVGL styles. Each repeated inline prop-set becomes ONE shared
  # lv_style_t attached by reference (`styles: [id]`) instead of a per-object LOCAL style -> reclaims the LVGL-9
  # local-style heap tax. Pixel-identical: same props, same MAIN/DEFAULT selector, and any residual inline prop
  # still wins (local outranks added). Added per bisectable group. Baseline heap 40884; target ~+8-9KB.
  style_definitions:
    - id: s_transp          # G1: transparent flex container (bg_opa TRANSP + border 0 + pad 0), ~44 widgets
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
    - id: s_bg_screen       # Batch1/B: screen & zone background (0x0a0a0a), 11 widgets
      bg_color: 0x0a0a0a
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
    - id: s_bg_header       # Batch1/C: header / panel bar (0x1a1d24), 6 widgets
      bg_color: 0x1a1d24
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
    - id: s_bar_seg         # Batch1/I: signal-bar segment (0x333333), 8 widgets (bg_color runtime-mutated; local wins)
      radius: 0
      bg_color: 0x333333
      bg_opa: COVER
      border_width: 0
      pad_all: 0
    - id: s_caption         # Batch2/D: muted caption label
      text_font: montserrat_14
      text_color: 0x888888
    - id: s_value           # Batch2/E: value label
      text_font: montserrat_14
      text_color: 0xeeeeee
    - id: s_title           # Batch2/F: screen title
      text_font: montserrat_14
      text_color: 0xdddddd
    - id: s_counter         # Batch2/G: page counter "n/6"
      text_font: montserrat_10
      text_color: 0x666666
    - id: s_value_lg        # Batch2/H: big detail value
      text_font: montserrat_16
      text_color: 0xeeeeee
  pages:
    # -------------------------------------------------------------------------
    # BOOT SPLASH — brand entrance (~2.6s) then hands off to the dashboard.
    # FIRST page = shown at power-on. NOT in the S1 %6 cycle (like page_setup).
    # mark + two-tone wordmark start at opa 0 (black); the 500ms loop fades/zooms
    # them in (lv_anim), holds, fades the lockup out, then lv_scr_loads the
    # dashboard (or page_setup if the AP is up). Stacked = variant A (matches the
    # setup screen). Composition derives from the vector master — re-export the
    # mark at other sizes for the CYD (240x320) port; do not redraw per board.
    # -------------------------------------------------------------------------
    - id: page_splash
      bg_color: 0x0a0a0a
      bg_opa: COVER
      widgets:
        - obj:
            id: splash_box
            align: CENTER
            x: 0
            y: 0
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [s_transp]
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 6
            widgets:
              - image:
                  id: splash_mark
                  src: winterdash_mark_lg_img   # bigger splash mark (B, ~66px); resize on the image entry
                  opa: 0%          # faded in by on_boot (opacity only — deliberately no zoom transform)
              - obj:
                  id: splash_wm
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [s_transp]
                  scrollbar_mode: "OFF"
                  opa: 0%          # faded in a beat (~200ms) after the mark
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    pad_column: 0
                  widgets:
                    - label: { text: "Winter", text_font: montserrat_26, text_color: 0xeaf4ff }
                    - label: { text: "Dash", text_font: montserrat_26, text_color: 0x38bdf8 }
    # -------------------------------------------------------------------------
    # SCREEN 1 — Dashboard
    # -------------------------------------------------------------------------
    - id: page_dashboard
      widgets:
        - obj:
            id: live_content
            x: 0
            y: 0
            width: 240
            height: 135
            styles: [s_bg_screen]
            widgets:
              # ----- Banner -----
              - obj:
                  id: banner
                  x: 0
                  y: 0
                  width: 240
                  height: 58
                  styles: [s_bg_header]
                  widgets:
                    - image:
                        id: banner_img
                        src: preset_battery_img
                        align: BOTTOM_LEFT
                        x: 3
                        y: -2
                    - obj:
                        id: clock_cluster
                        align: TOP_RIGHT
                        x: -6
                        y: 5
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: [s_transp]
