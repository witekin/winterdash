# =============================================================================
# display_cyd.yaml — CYD (ESP32-2432S028R) display + LANDSCAPE branded LVGL tree
# -----------------------------------------------------------------------------
# Target: the TTGO WinterDash UI, 1:1, on the bigger CYD screen — same identity (dark header bar 0x1a1d24 with
# hero + clock/status cluster, GREEN voltage 0x3ddc84 + gauge with redlines/expected-band/marker, current+temp
# stat row), ported from display_tdisplay's 240x135 landscape layout to the CYD's 320x240 landscape. NOT a
# redesign — the same widgets/colours/fonts, scaled up. The panel is native 240x320 portrait; `transform`
# rotates it to 320x240 landscape (mirror flags tuned on the board — a visual step like touch calibration).
#
# PORT STATUS: the full TTGO UI is ported AND HW-verified E2E on real hardware — all 5 pages (splash, dashboard +
# offline/fault/network-fault overlays, charger detail, bluetooth, network, system + a touch actions menu; the
# on-device charge-log page was CUT here too, matching the TTGO A3.5 — the web Charger card + /wd/log.json stay),
# the animated boot-splash, the screensaver, the WiFi-SETUP/AP-onboarding page, and the
# custom-banner-on-screen render (mmap, via the internal 0x50000 storage slot — the microSD phase was ABANDONED).
# Draw logic is near-identical to the TTGO — only the gauge width BW (222 -> 296) and pixel offsets scale.
# STILL OPEN (on-screen polish, board-in-hand): fine-tune the detail/ble/network page coords (dashboard +
# system already eyeballed) + per-unit touch calibration robustness. When the coords settle, a per-board geometry
# generator could kill the TTGO/CYD tree duplication (single-source). See cyd-bringup-plan.md.
#
# Reads the board-agnostic status DTO (status_compute::status_out(), core-filled). Draw deps all live in core
# (status_since_ms/sntp_time/demo_active/last_packet_ms/wifi_rssi) except fault_active (display-owned, below).
# =============================================================================

display:
  # mipi_spi ESP32-2432S028 (ILI9341). NO reset_pin (RST on EN; GPIO4 = RGB-red). spi_id binds the display bus.
  # transform rotates the native 240x320 portrait to 320x240 landscape — ILI9341 has no MADCTL in its init, so
  # transform is honoured. mirror_x/mirror_y pick which of the 4 landscape rotations; TUNE on the board.
  - platform: mipi_spi
    model: ESP32-2432S028
    id: tft
    spi_id: tft_bus
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    update_interval: never

image:
  # Baked BATTERY hero (board_assets[esp32-cyd].screen = [Battery]). Canonical ids (match TTGO so the
  # banner_preset lookup carries over). type RGB565 (not RGB) -> LV_IMG_CF_RGB565A8 = 3 B/px (vs ARGB8888's
  # 4 B/px): ~25% less flash, visually ~identical, and the SAME format the converter bakes custom heroes in.
  # dashboard resized up (fills the adaptive box-B hero zone: aspect ~1.79 -> ~140x78, right edge clears the
  # status x148); the saver keeps its size (format-only saving ~31KB on the tight 4MB OTA slot).
  - file: images/battery.webp
    id: preset_battery_img
    type: RGB565
    transparency: alpha_channel
    resize: 140x84
  - file: images/battery.webp
    id: preset_battery_saver_img       # rendered by the screensaver (render_saver)
    type: RGB565
    transparency: alpha_channel
    resize: 300x132
  # Wi-Fi-setup onboarding assets (shown while the fallback AP is up). QR = a Wi-Fi-join code for the OPEN
  # "WinterDashAP" (baked white quiet-zone); brand mark for the hero. RGB565 straight from flash (0 DRAM).
  - file: images/wifi_setup_qr.png
    id: wifi_setup_qr_img
    type: RGB565
  - file: images/winterdash_mark_hi.png
    id: winterdash_mark_img
    type: RGB565
    resize: 56x56

font:
  # RESTRICTED-GLYPH big fonts (Montserrat OFL via gfonts, rasterised at build). Only the glyphs each big label
  # can show -> a fraction of a full-Latin built-in montserrat's flash (the [[esphome-lvgl-builtin-font-flash]]
  # lever — the enabler for fitting the full 9-page port in the CYD's 0x1D0000 slot). Small varied-text labels
  # (clock/units/stats/sys rows/notes/SSID) keep the built-in montserrat sizes below (general glyphs, cheap).
  - file:
      type: gfonts
      family: Montserrat
      weight: 600
    id: m_big
    size: 36
    bpp: 4                              # 16-level antialiasing (ESPHome default is bpp:1 = NO AA -> jagged on big
                                        # fonts). Restricted glyph set keeps the 4x-vs-bpp1 flash cost small.
    glyphs: "0123456789.- WinterDash"   # voltage_val (digits, guard '-') + boot-splash title ("WinterDash")
  - file:
      type: gfonts
      family: Montserrat
      weight: 600
    id: m_status
    size: 22
    bpp: 4                                   # 16-level AA (matches m_big; smooths the big status word)
    glyphs: "ABCDEFGHIJKLMNOPQRSTUVWXYZ "   # status words (all uppercase: CHARGING/CHARGED/IDLE/FAULT/RECOND/OFFLINE/...)
  # Material Design Icons — same glyph roles as the TTGO, sized up for the bigger panel.
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_16
    size: 18
    bpp: 4
    glyphs:
      - "\U000F00AF"  # bluetooth
      - "\U000F00B2"  # bluetooth-off
      - "\U000F05A9"  # wifi
      - "\U000F095C"  # current-dc
      - "\U000F050F"  # thermometer
      - "\U000F0241"  # flash (voltage / bulk-absorption charge-log)
      - "\U000F029A"  # gauge (power)
      - "\U000F01D9"  # dots-vertical (System "actions" hint)
      - "\U000F0026"  # alert (fault charge-log row)
      - "\U000F05E0"  # check-circle (float/storage charge-log row)
      - "\U000F0904"  # power-sleep (off/powered-on charge-log row)
      - "\U000F0141"  # chevron-left  (page nav hint)
      - "\U000F0142"  # chevron-right (page nav hint)
  - file: fonts/materialdesignicons-webfont.ttf
    id: mdi_status
    size: 26
    bpp: 4
    glyphs:
      - "\U000F0241"  # flash        (charging / voltage)
      - "\U000F05E0"  # check-circle (charged)
      - "\U000F0026"  # alert        (fault)
      - "\U000F0904"  # power-sleep  (idle)
      - "\U000F00B2"  # bluetooth-off (offline)

# --- Display config (runtime, NVS; web/HA-configurable) — ported from display_tdisplay so the CYD exposes the
# same dimming knobs. dim_timeout/return_timeout in seconds; backlight_level in %; idle-dim is the 4-level idle_dim_level. ---
number:
  # These 3 are `internal: true` -> OFF SSE + HA + the stock /number/<id>/set route. The web drives them via the custom
  # /wd/cfg POST and reads them via /wd/cfg.json (see web_dashboard.h CfgPost). Kept as template numbers for the NVS
  # restore + .state the dim machine reads. (Brightness = board config, deliberately NOT on HA — a project design decision.)
  - platform: template
    id: dim_timeout
    name: "Dim timeout"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: return_timeout
    name: "Return timeout"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 1800
    step: 5
    unit_of_measurement: "s"
    mode: box
  - platform: template
    id: backlight_level
    name: "Backlight level"
    internal: true
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 30
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
  # NOTE: `night_dim` AND `dim_level` numbers are GONE — night level = fixed wd_bl::NIGHT_FACTOR, idle = 0.65*day (both in
  # backlight_model.h). Only the 3 above remain, now internal:. The user-facing surface is 2 knobs (Backlight = backlight_level,
  # Auto-dim = ldr_enabled), driven web-only via /wd/cfg; timeouts are advanced.

globals:
  - id: current_page           # 0=dashboard 1=detail 3=bluetooth 4=network 5=system (2=charlog CUT — web /wd/log.json keeps the log; index skipped, not renumbered)
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_activity_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: backlight_dim
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: splash_active
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: splash_start_ms        # anchors the ~3.8s animated boot-splash entrance (set in on_boot -100)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: saver_active           # screensaver up (ambient idle view; loaded explicitly, not in the page cycle)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fault_active           # display-owned (TTGO has it in display_tdisplay); gates the dashboard fill
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: offline_alert          # display-owned: offline is in the FULL-overlay phase (vs relaxed ambient)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: idle_dim_level         # screen idle-dim: 0=OFF(panel dark) 1=LOW 2=MED 3=HIGH — web /wd/cfg 'idim', NVS. Default MED.
    type: int
    restore_value: true
    initial_value: '2'
  - id: serious_warn_active    # over/undervoltage keep-lit (compute-derived o.serious_warn; keeps screen lit + wakes)
    type: bool
    restore_value: no
    initial_value: 'false'
  # --- System actions-menu state (touch adaptation of the TTGO 2-button menu) ---
  - id: in_menu                # System page: actions menu open (vs the info view)
    type: bool
    restore_value: no
    initial_value: 'false'
  # (menu_sel removed 2026-09-09 — dead on the CYD: the Actions menu uses touch Y-band hit-testing, not a selection
  #  index. It was TTGO-port residue; the TTGO still uses menu_sel with its 2-button nav.)
  - id: touching               # a finger is currently down (set on_touch, cleared on_release)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: touch_down_ms          # millis() at touch-down; 0 once consumed by a completed hold/open
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_touch_x           # x of the last touch-down (on_release has no coords -> use this for L/R nav)
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_touch_y           # y of the last touch-down -> menu button hit-test band + Actions-open zone
    type: int
    restore_value: no
    initial_value: '0'

# Animated boot-splash entrance (display-only; ported 1:1 from display_tdisplay.yaml's on_boot -100). Runs after the
# display is up (setup prio 600 > -100): load page_splash, synchronously flush it, anchor splash_start_ms, then start
# the fades (mark 0-700ms, wordmark a beat later 1100-1700ms, whole lockup fade-out 3300-3800ms). Fade only — no zoom
# transform (that "snows" the alpha-less RGB565 mark edges). The draw loop times the handoff at >=3800ms. (No backlight
# off/on trick: the CYD light is restore_mode ALWAYS_ON, unlike the TTGO's ALWAYS_OFF.)
esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            wd_font_buf::install();   // re-point LVGL font glyph-buffer alloc to a static buffer BEFORE the first paint (lv_refr_now below) -> glyph rasterization never mallocs from the fragmentable 8-bit heap (NULL-deref crater mitigation)
            id(last_activity_ms) = millis();
            lv_scr_load(id(cyd_page_splash)->obj);
            lv_refr_now(NULL);
            id(splash_start_ms) = millis();
            {
              lv_anim_t am; lv_anim_init(&am);                       // mark: fade in 0-700ms
              lv_anim_set_var(&am, id(splash_mark));
              lv_anim_set_values(&am, 0, 255);
              lv_anim_set_time(&am, 700);
              lv_anim_set_exec_cb(&am, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&am);
              lv_anim_t aw; lv_anim_init(&aw);                       // wordmark: fade in 1100-1700ms
              lv_anim_set_var(&aw, id(splash_wm));
              lv_anim_set_values(&aw, 0, 255);
              lv_anim_set_time(&aw, 600);
              lv_anim_set_delay(&aw, 1100);
              lv_anim_set_exec_cb(&aw, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&aw);
              lv_anim_t af; lv_anim_init(&af);                       // lockup: hold, fade out 3300-3800ms
              lv_anim_set_var(&af, id(splash_box));
              lv_anim_set_values(&af, 255, 0);
              lv_anim_set_time(&af, 500);
              lv_anim_set_delay(&af, 3300);
              lv_anim_set_exec_cb(&af, [](void *o, int32_t v){ lv_obj_set_style_opa((lv_obj_t *)o, (lv_opa_t)v, 0); });
              lv_anim_start(&af);
            }

lvgl:
  buffer_size: 12.5%           # draw-buffer DRAM (not flash); 12.5% = 30 full lines (320x30x2) = 18.75KB (was 15% = 36 lines/23KB). Frees ~4KB TOTAL 8-bit heap. Buffer-sweep 2026-09-06 PROVED buffer size does NOT fix the COLD-LOAD crater: idle blk8 15%=13312 / 12.5%=13312 / 10%=14336, load crater floor only 512->832->1024 (crater is contiguity/fragmentation-bound, immune to total-free; 10% was worse — page couldn't finish loading). RE-TESTING 12.5% 2026-09-07 (Flow-4 era): web is lighter now + the target is the SLOWER screensaver-custom-hero fragmentation crater (not cold-load) — the ~4KB extra total may buy the saver-hero case margin even though it won't lift the contiguity-bound blk8. Revert to 15% if it's a wash. Real fix stays LVGL memory isolation.
  default_font: montserrat_16
  # Persistent L/R page-nav hint arrows (bottom corners), on the top layer so they show over EVERY page. The
  # 100ms interval hides them during the actions menu / overlays / splash (only shown on a clean page view).
  top_layer:
    widgets:
      - label:
          id: nav_arrow_l
          align: BOTTOM_LEFT
          x: 5
          y: -2
          text: "\U000F0141"       # mdi chevron-left
          text_font: mdi_16
          text_color: 0x5a6472
      - label:
          id: nav_arrow_r
          align: BOTTOM_RIGHT
          x: -5
          y: -2
          text: "\U000F0142"       # mdi chevron-right
          text_font: mdi_16
          text_color: 0x5a6472
  style_definitions:
    - id: s_transp             # transparent flex container
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
    - id: s_bg_screen          # screen / zone background (0x0a0a0a)
      bg_color: 0x0a0a0a
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
    - id: s_bg_header          # header / panel bar (0x1a1d24)
      bg_color: 0x1a1d24
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
    # text styles (ported from display_tdisplay, sizes scaled up for 320x240)
    - id: s_caption            # muted caption label
      text_font: montserrat_16
      text_color: 0x888888
    - id: s_value              # value label
      text_font: montserrat_16
      text_color: 0xeeeeee
    - id: s_title              # screen title
      text_font: montserrat_18
      text_color: 0xdddddd
    - id: s_counter            # page counter "n/5"
      text_font: montserrat_14
      text_color: 0x666666
    - id: s_value_lg           # big detail value
      text_font: montserrat_20
      text_color: 0xeeeeee
    - id: s_bar_seg            # signal-bar segment (bg_color runtime-mutated in the draw; local wins)
      radius: 0
      bg_color: 0x333333
      bg_opa: COVER
      border_width: 0
      pad_all: 0
  pages:
    # --- boot splash (handed off to the dashboard after ~2.5s by the draw interval) --------------------
    - id: cyd_page_splash
      bg_color: 0x0a0a0a
      bg_opa: COVER
      widgets:
        # Brand entrance (ported 1:1 from TTGO page_splash): mark + two-tone wordmark, stacked, both start at
        # opa 0 (black). The on_boot(-100) lambda fades the mark in (0-700ms), the wordmark a beat later
        # (1100-1700ms), then fades the whole lockup out (3300-3800ms) before the handoff to the dashboard.
        - obj:
            id: splash_box
            align: CENTER
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            styles: [s_transp]
            scrollbar_mode: "OFF"
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 10
            widgets:
              - image:
                  id: splash_mark
                  src: winterdash_mark_img   # 56x56 brand mark (RGB565 from flash; no zoom — alpha-less)
                  opa: 0%
              - obj:
                  id: splash_wm
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: [s_transp]
                  scrollbar_mode: "OFF"
                  opa: 0%
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_cross: CENTER
                    pad_column: 0
                  widgets:
                    - label: { text: "Winter", text_font: m_big, text_color: 0xeaf4ff }
                    - label: { text: "Dash", text_font: m_big, text_color: 0x38bdf8 }
    # --- DASHBOARD (page 0) — TTGO identity, landscape 320x240 -----------------------------------------
    - id: cyd_page_dashboard
      widgets:
        - obj:
            id: live_content
            x: 0
            y: 0
            width: 320
            height: 240
            scrollbar_mode: "OFF"
            styles: [s_bg_screen]
            widgets:
              # ----- Header bar -----
              - obj:
                  id: banner
                  x: 0
                  y: 0
                  width: 320
                  height: 108            # reserved hero-band (top, = hero height + margin) + status-band (below)
                  scrollbar_mode: "OFF"
                  styles: [s_bg_header]
                  widgets:
                    - image:
                        id: banner_img
                        src: preset_battery_img
                        align: TOP_LEFT       # boot default; the render lambda re-anchors by height (v4 adaptive: wide->bottom, tall->top)
                        x: 6
                        y: 10
                    - obj:
                        id: clock_cluster
                        align: TOP_RIGHT
                        x: -8
                        y: 8
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: [s_transp]
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          pad_column: 7
                        widgets:
                          - label:
                              id: demo_badge
                              text: "DEMO"
                              text_font: montserrat_12
                              text_color: 0xef4444
                          - label:
                              id: link_dot
                              text: ""
                              text_font: mdi_16
                              text_color: 0x38bdf8
                          - label:
                              id: wifi_icon
                              text: ""
                              text_font: mdi_16
                              text_color: 0x3ddc84
                          - label:
                              id: clock_label
                              text: "--:--"
                              text_font: montserrat_16
                              text_color: 0xbbbbbb
                    - obj:
                        id: status_cluster
                        align: TOP_LEFT       # fixed inner-corner "notch" the adaptive hero always dodges: box-A heroes are
                        x: 148                # short enough to end above it (y<=70), box-B heroes narrow enough to stay left (x<=145)
                        y: 72
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: [s_transp]
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              id: status_icon
                              text: ""
                              text_font: mdi_status
                              text_color: 0x3ddc84
                          - label:
                              id: status_word
                              text: "..."
                              text_font: m_status
                              text_color: 0x3ddc84
              # ----- Data zone -----
              - obj:
                  id: data_zone
                  x: 0
                  y: 108
                  width: 320
                  height: 132
                  scrollbar_mode: "OFF"
                  styles: [s_bg_screen]
                  widgets:
                    - label:                     # detail TOP: raw charger phase (status-coloured) or an amber anomaly
                        id: charger_phase
                        align: TOP_RIGHT
                        x: -12
                        y: 8
                        width: 150
                        text: ""
                        text_font: montserrat_14
                        text_color: 0x777777
                        text_align: RIGHT
                        long_mode: WRAP
                    - label:                     # detail BOTTOM: muted time-in-status (always)
                        id: anomaly_text
                        align: TOP_RIGHT
                        x: -12
                        y: 28
                        width: 150
                        text: ""
                        text_font: montserrat_14
                        text_color: 0x777777
                        text_align: RIGHT
                        long_mode: WRAP
                    # voltage value + unit in a flex ROW anchored TOP_LEFT (24,8): the "V" always sits a fixed ~6px
                    # after the number regardless of its width — a plain fixed-x unit either gaps on narrow values
                    # ("13.14", narrow 1s, ends ~x100) or overlaps wide ones ("28.80" ends ~x118). CENTER aligns the
                    # small unit vertically on the big number (matches the old y:8/y:24 baseline-ish look).
                    - obj:
                        id: volt_cluster
                        align: TOP_LEFT
                        x: 24
                        y: 8
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: [s_transp]
                        scrollbar_mode: "OFF"
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: END      # bottom-align: the "V" baseline sits on the number's bottom
                          pad_column: 6
                        widgets:
                          - label:
                              id: voltage_val
                              text: "0.00"
                              text_font: m_big
                              text_color: 0x3ddc84
                          - label:
                              id: volt_unit
                              text: "V"
                              text_font: montserrat_20
                              text_color: 0x777777
                              translate_y: -4      # flex END bottom-aligns the boxes -> V ends up ~descender-diff
                                                   # too low; raise it so its baseline sits on the number's bottom
                    - obj:
                        id: bar_track
                        align: TOP_MID
                        x: 0
                        y: 66
                        width: 296
                        height: 13
                        radius: 4
                        bg_color: 0x1c1c1c
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                        widgets:
                          - obj:
                              id: redline_low
                              x: 0
                              y: 0
                              width: 49
                              height: 13
                              radius: 0
                              bg_color: 0xef4444
                              bg_opa: 45%
                              border_width: 0
                              pad_all: 0
                          - obj:
                              id: redline_high
                              x: 272
                              y: 0
                              width: 24
                              height: 13
                              radius: 0
                              bg_color: 0xef4444
                              bg_opa: 45%
                              border_width: 0
                              pad_all: 0
                          - obj:
                              id: exp_band
                              x: 197
                              y: 0
                              width: 20
                              height: 13
                              radius: 2
                              bg_color: 0x3ddc84
                              bg_opa: 65%
                              border_width: 0
                              pad_all: 0
                    - obj:
                        id: volt_marker
                        align: TOP_LEFT
                        x: 147
                        y: 62
                        width: 2
                        height: 21
                        radius: 0
                        bg_color: 0xffffff
                        bg_opa: COVER
                        border_width: 0
                        pad_all: 0
                    - obj:
                        id: stat_row
                        align: BOTTOM_MID
                        x: 0
                        y: -8
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        styles: [s_transp]
                        layout:
                          type: flex
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          pad_column: 34
                        widgets:
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              styles: [s_transp]
                              layout:
                                type: flex
                                flex_flow: ROW
                                flex_align_cross: CENTER
