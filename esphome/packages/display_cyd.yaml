                                    text_color: 0xe8e8e8
        # ----- Unified full-screen takeover overlay (offline / fault / netfault -> ONE state-driven overlay).
        # Tier-3 heap merge: the 3 former overlays were byte-identical 320x240 s_bg_screen COLUMN/CENTER containers;
        # only per-label content/colour + fault's 2nd (ctx) line differed. One container + 6 labels (was 17 objects)
        # driven by state in the draw lambda -> ~1.5-2KB resident 8-bit heap reclaimed. The takeover logic keeps the
        # 3 priority branches (netfault > offline > fault) and still publishes fault_active/offline_alert unchanged
        # (the RGB LED / saver / backlight read those GLOBALS, never these ids). ov_sub = fault ctx (hidden else);
        # ov_clock/ov_demo hidden in netfault; the icon/title opacity is FAULT-flash-only (reset on every entry). -----
        - obj:
            id: ov
            x: 0
            y: 0
            width: 320
            height: 240
            scrollbar_mode: "OFF"
            styles: [s_bg_screen]
            hidden: true
            layout:
              type: flex
              flex_flow: COLUMN
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 8
            widgets:
              - label:
                  id: ov_icon
                  text: ""
                  width: 320
                  text_font: mdi_status
                  text_color: 0xef4444
                  text_align: CENTER
              - label:
                  id: ov_title
                  text: ""
                  width: 320
                  text_font: m_status
                  text_color: 0xef4444
                  text_align: CENTER
              - label:
                  id: ov_msg
                  text: ""
                  width: 300
                  text_font: montserrat_14
                  text_color: 0xe8e8e8
                  text_align: CENTER
                  long_mode: WRAP
              - label:
                  id: ov_sub
                  text: ""
                  width: 300
                  text_font: montserrat_14
                  text_color: 0x777777
                  text_align: CENTER
                  hidden: true
              - label:
                  id: ov_clock
                  ignore_layout: true
                  align: TOP_RIGHT
                  x: -10
                  y: 8
                  text: "--:--"
                  text_font: montserrat_16
                  text_color: 0x999999
              - label:
                  id: ov_demo
                  ignore_layout: true
                  align: TOP_LEFT
                  x: 10
                  y: 8
                  text: "DEMO"
                  text_font: montserrat_14
                  text_color: 0xf5b942
                  hidden: true
